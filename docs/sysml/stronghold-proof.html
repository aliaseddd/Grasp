<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stronghold Proof Structure</title>
<!-- The view proofStructure of stronghold-proof.sysml on an endless plane you can move around, with notes you add
     by clicking it. Open this file in a browser; it needs no server. The drawing between the drawing markers is
     written by draw.mjs: edit it there. The notes and the archive between the notes markers are written by
     save-notes.mjs. Published on claude.ai, the page keeps its notes in the page's database, where Claude reads them. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Stronghold's design tokens (app/src/design/tokens.css), with a dark set made from the same ink and teal. */
:root {
  --bg: #EEF2F4;
  --card: #FFFFFF;
  --fg: #182630;
  --fg-2: #5B6973;
  --line: #E2E7EB;
  --line-strong: #CBD3D9;
  --grid: #B9C3CB;
  --accent: #176B61;
  --on-accent: #FFFFFF;
  --danger: #B23C3C;
  --shadow: 0 1px 2px rgba(24, 38, 48, 0.12), 0 8px 24px -8px rgba(24, 38, 48, 0.22);
  --sans: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1317; --card: #162128; --fg: #E2E7EB; --fg-2: #A9B4BC; --line: #26343D; --line-strong: #3A4A55;
    --grid: #2C3A44; --accent: #6CB8A9; --on-accent: #10181D; --danger: #F08A8A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -8px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1317; --card: #162128; --fg: #E2E7EB; --fg-2: #A9B4BC; --line: #26343D; --line-strong: #3A4A55;
  --grid: #2C3A44; --accent: #6CB8A9; --on-accent: #10181D; --danger: #F08A8A;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -8px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* The bar along the top. */
.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.title { display: grid; gap: 2px; min-width: 0; }
.eyebrow { margin: 0; font: 500 11px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font: 600 17px/1.25 var(--sans); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: 600 13px/1 var(--sans);
  color: var(--fg);
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 9px 12px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible, textarea:focus-visible, .canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* The plane: it fills the window under the bar, and everything else floats on it. */
.stage { position: relative; min-height: 0; overflow: hidden; }
.canvas { position: absolute; inset: 0; touch-action: none; cursor: grab; outline: none; }
.canvas.is-panning, .canvas.is-panning * { cursor: grabbing !important; }
.canvas svg { display: block; width: 100%; height: 100%; color: var(--fg); user-select: none; -webkit-user-select: none; }
.sysml .plane-dot { fill: var(--grid); }
.sysml.is-far .plane { display: none; }
.sysml .paper { fill: var(--card); pointer-events: none; }
.sysml [data-el] { cursor: crosshair; }
.sysml .outline { pointer-events: all; }
.sysml .hit { pointer-events: stroke; }
.sysml .accent { stroke: var(--accent); }
.sysml .is-hover > .outline { stroke: var(--accent); }
.sysml .is-marked > .outline { stroke: var(--accent); stroke-width: 2.5; }
.sysml .pin { cursor: grab; touch-action: none; }
.sysml .pin.is-dragging { cursor: grabbing; }
.sysml .pin circle { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.sysml .pin.is-active circle { stroke: var(--fg); stroke-width: 2.5; }
.sysml .pin text { fill: var(--on-accent); font: 600 11px/1 var(--sans); text-anchor: middle; dominant-baseline: central; pointer-events: none; }

.float { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.hud {
  left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  max-width: min(560px, calc(100% - 220px)); padding: 8px 12px; display: grid; gap: 2px;
}
.hint { margin: 0; font: 400 12.5px/1.4 var(--mono); color: var(--fg-2); overflow-wrap: anywhere; }
.status { margin: 0; font-size: 13px; color: var(--fg); min-height: 0; }
.status:empty { display: none; }
.zoom {
  right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 4px; padding: 4px;
}
.zoom button { padding: 7px 10px; border-color: transparent; }
.zoom button:hover { border-color: var(--line-strong); }
.zoom output { min-width: 48px; text-align: center; font: 500 12px/1 var(--mono); color: var(--fg-2); font-variant-numeric: tabular-nums; }

.notes {
  top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 330px; max-height: calc(100% - 84px); overflow: auto;
  display: grid; gap: 12px; align-content: start; padding: 14px;
}
.notes-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.notes h2 { margin: 0; display: flex; align-items: baseline; gap: 8px; font: 600 15px/1.3 var(--sans); }
.count { font: 500 12px/1 var(--mono); color: var(--fg-2); }
.hide { padding: 6px 9px; font-size: 12px; }
.show-notes { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); box-shadow: var(--shadow); }
.empty { margin: 0; font-size: 13.5px; color: var(--fg-2); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.note { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
.note.is-active { border-color: var(--accent); }
.note-head { display: flex; align-items: center; gap: 8px; }
.badge {
  flex: none; width: 24px; height: 24px; padding: 0; border: none; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font: 600 11px/1 var(--sans);
}
.badge:hover { color: var(--on-accent); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
.on { flex: 1; min-width: 0; font-size: 12.5px; color: var(--fg-2); overflow-wrap: anywhere; }
.on b { font-weight: 600; color: var(--fg); }
.remove { padding: 6px 8px; font-size: 12px; color: var(--fg-2); border-color: var(--line); }
.remove:hover { color: var(--danger); border-color: var(--danger); }
textarea.text {
  width: 100%; min-height: 60px; resize: vertical;
  font: 400 13.5px/1.5 var(--sans); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
}
textarea.text[readonly] { resize: none; background: transparent; }
.meta { margin: 0; font: 400 11.5px/1.3 var(--mono); color: var(--fg-2); }

/* The archive: notes Claude has acted on, newest first, each with what was done about it. */
.archive { padding-top: 12px; border-top: 1px solid var(--line); }
.archive summary { cursor: pointer; font: 600 13.5px/1.3 var(--sans); color: var(--fg); }
.archive summary:hover { color: var(--accent); }
.archive summary .count { margin-left: 6px; }
.archive-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.archived { display: grid; gap: 6px; padding: 10px; border: 1px dashed var(--line-strong); border-radius: 6px; }
.chip {
  flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line-strong); color: var(--fg-2); font: 600 11px/1 var(--sans);
}
.archived-text, .outcome { margin: 0; font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.outcome { color: var(--fg-2); }
.outcome b { font-weight: 600; color: var(--accent); }

.foot { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.where { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--fg-2); }
.where:empty { display: none; }
.warning { margin: 0; font-size: 13px; color: var(--danger); }
.delete-all { justify-self: start; color: var(--danger); border-color: var(--line); }
.delete-all:hover { color: var(--danger); border-color: var(--danger); }
.copy-box {
  width: 100%; min-height: 120px; resize: vertical;
  font: 400 12px/1.5 var(--mono); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px;
}
@media (max-width: 720px) {
  .notes { top: auto; left: 12px; right: 12px; width: auto; bottom: 64px; max-height: 46%; }
  .hud { max-width: calc(100% - 124px); bottom: auto; top: 12px; }
}
</style>
</head>

  var reason = '';           // why the notes can only be read, when that needs saying
  var saved = readSaved();   // the notes and the archive saved in this file
  var notes = saved.notes.map(tidy);
  var archive = saved.archive;
  var shown = '';            // the notes and the archive as last drawn, so unchanged ones aren't drawn again

  function now() { return new Date().toISOString(); }
  function say(message) { status.textContent = message; }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
  function editable() { return mode === 'shared' || mode === 'local'; }
  function baseHint() { return MOVE_HINT + (editable() ? ADD_HINT : ''); }

  function groupFor(el) {
    var groups = svg.querySelectorAll('[data-el]');
    for (var i = 0; i < groups.length; i++) {
      if (groups[i].getAttribute('data-el') === el) return groups[i];
    }
    return null;
  }

  // The model element a node in the drawing belongs to: its nearest box, or the view itself.
  function elementOf(node) {
    var g = node && node.closest ? node.closest('[data-el]') : null;
    if (!g || !svg.contains(g)) return { el: VIEW.el, label: VIEW.label, g: null };
    return { el: g.getAttribute('data-el'), label: g.getAttribute('data-label'), g: g };
  }

  // A note's id is also its name in the shared notes, so it keeps to letters, digits, - and _.
  function isNote(n) {
    return !!n && typeof n === 'object' && typeof n.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(n.id) &&
      typeof n.el === 'string' && typeof n.text === 'string' && isFinite(n.x) && isFinite(n.y);
  }

  function tidy(n) {
    var g = groupFor(n.el);
    var label = g ? g.getAttribute('data-label') : (typeof n.label === 'string' ? n.label : n.el);
    var created = typeof n.created === 'string' ? n.created : now();
    return {
      id: n.id, no: n.no >= 1 ? Math.floor(n.no) : 0, el: n.el, label: label, x: Math.round(+n.x), y: Math.round(+n.y),
      text: n.text, created: created, updated: typeof n.updated === 'string' ? n.updated : created
    };
  }

  function tidyArchived(n) {
    var t = tidy(n);
    t.resolution = typeof n.resolution === 'string' ? n.resolution : '';
    t.archived = typeof n.archived === 'string' ? n.archived : t.updated;
    return t;
  }

  function readSaved() {
    var none = { saved: null, notes: [], archive: [] };
    var block = document.getElementById('saved-notes');
    try {
      var data = block ? JSON.parse(block.textContent) : null;
      if (!data || typeof data !== 'object') return none;
      return {
        saved: typeof data.saved === 'string' ? data.saved : null,
        notes: Array.isArray(data.notes) ? data.notes.filter(isNote).map(tidy) : [],
        archive: Array.isArray(data.archive) ? data.archive.filter(isNote).map(tidyArchived).sort(byArchived) : []
      };
    } catch (error) {
      return none;
    }
  }

  function byCreated(a, b) { return a.created < b.created ? -1 : a.created > b.created ? 1 : 0; }
  function byNumber(a, b) { return (a.no - b.no) || byCreated(a, b); }
  function byArchived(a, b) { return a.archived < b.archived ? -1 : a.archived > b.archived ? 1 : byNumber(a, b); }

  // Notes are numbered once and keep their number, in the archive too.
  function nextNumber() {
    var top = 0;
    notes.concat(archive).forEach(function (n) { top = Math.max(top, n.no || 0); });
    return top + 1;
  }

  // Gives each note in `list` that has no number, or one already taken, the next free number, oldest first.
  function numberNew(list, others) {
    var taken = {};
    var top = 0;
    function take(n) {
      taken[n.no] = true;
      top = Math.max(top, n.no);
    }
    others.forEach(function (n) { if (n.no) take(n); });
    var needs = [];
    list.forEach(function (n) {
      if (n.no && !taken[n.no]) take(n);
      else needs.push(n);
    });
    needs.sort(byCreated).forEach(function (n) {
      n.no = top + 1;
      take(n);
    });
    return list;
  }

  function fieldsOf(n, keys) {
    var out = {};
    keys.forEach(function (key) { out[key] = n[key]; });
    return out;
  }

  function dateOf(iso) {
    return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function when(n) {
    var added = dateOf(n.created);
    var edited = dateOf(n.updated);
    return 'Added ' + added + (edited !== added ? ' · edited ' + edited : '');
  }

  function toDrawing(clientX, clientY) {
    var point = new DOMPoint(clientX, clientY).matrixTransform(svg.getScreenCTM().inverse());
    return { x: Math.round(point.x), y: Math.round(point.y) };
  }

  function grow(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 2 + 'px';
  }

  // ---- The camera: what part of the plane the window shows, and how big.

  function readCamera() {
    try {
      var c = JSON.parse(localStorage.getItem(CAMERA_KEY) || 'null');
      if (c && isFinite(c.x) && isFinite(c.y) && isFinite(c.k) && c.k > 0) return { x: +c.x, y: +c.y, k: clamp(+c.k, MIN_ZOOM, MAX_ZOOM) };
    } catch (error) { /* start from a fitted view */ }
    return null;
  }

  function stageSize() {
    var r = canvas.getBoundingClientRect();
    return { left: r.left, top: r.top, width: Math.max(r.width, 1), height: Math.max(r.height, 1) };
  }

  // The part of the window the notes panel doesn't cover, so "fit" and "show" aim at what you can see.
  function openArea() {
    var s = stageSize();
    var area = { x: 0, y: 0, width: s.width, height: s.height };
    if (!panel.hidden && s.width > 720) area.width = Math.max(200, s.width - panel.offsetWidth - 24);
    if (s.width <= 720) {
      // On a phone the hint sits at the top and the zoom buttons at the bottom.
      area.y = hud.offsetHeight + 20;
      area.height = Math.max(160, s.height - area.y - 60 - (panel.hidden ? 0 : panel.offsetHeight + 12));
    }
    return area;
  }

  function pinTransform(n) {
    return 'translate(' + n.x + ' ' + n.y + ') scale(' + (1 / (camera ? camera.k : 1)).toFixed(4) + ')';
  }

  function apply() {
    var s = stageSize();
    svg.setAttribute('viewBox', [camera.x, camera.y, s.width / camera.k, s.height / camera.k].map(function (v) { return v.toFixed(2); }).join(' '));
    svg.classList.toggle('is-far', camera.k < 0.35);
    zoomLevel.textContent = Math.round(camera.k * 100) + '%';
    var pins = layer.children;
    for (var i = 0; i < pins.length; i++) {
      var n = noteById(pins[i].getAttribute('data-id'));
      if (n) pins[i].setAttribute('transform', pinTransform(n));
    }
    try { localStorage.setItem(CAMERA_KEY, JSON.stringify(camera)); } catch (error) { /* a convenience only */ }
  }

  function fit() {
    var area = openArea();
    var k = clamp(Math.min(area.width / PAPER.w, area.height / PAPER.h) * 0.94, MIN_ZOOM, MAX_ZOOM);
    camera = { k: k, x: PAPER.w / 2 - (area.x + area.width / 2) / k, y: PAPER.h / 2 - (area.y + area.height / 2) / k };
    apply();
  }

  // Zooms by `factor`, keeping the point under (clientX, clientY) where it is.
  function zoomAt(factor, clientX, clientY) {
    var s = stageSize();
    var px = clientX - s.left;
    var py = clientY - s.top;
    var wx = camera.x + px / camera.k;
    var wy = camera.y + py / camera.k;
    var k = clamp(camera.k * factor, MIN_ZOOM, MAX_ZOOM);
    camera = { k: k, x: wx - px / k, y: wy - py / k };
    apply();
  }

  function zoomAtCenter(factor) {
    var s = stageSize();
    var area = openArea();
    zoomAt(factor, s.left + area.x + area.width / 2, s.top + area.y + area.height / 2);
  }

  function showPoint(x, y) {
    var area = openArea();
    camera = { k: camera.k, x: x - (area.x + area.width / 2) / camera.k, y: y - (area.y + area.height / 2) / camera.k };
    apply();
  }

  // ---- Drawing the notes: a numbered pin on the plane and an entry in the list, for each open note. Archived
  // notes are listed under them, without pins.

  function noteById(id) {
    for (var i = 0; i < notes.length; i++) if (notes[i].id === id) return notes[i];
    return null;
  }

  function pinFor(n) {
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'pin');
    g.setAttribute('transform', pinTransform(n));
    g.setAttribute('data-id', n.id);
    var title = document.createElementNS(NS, 'title');
    title.textContent = 'Note ' + n.no + ' on ' + n.label + (editable() ? '. Drag to move it.' : '.');
    var circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('r', '11');
    var number = document.createElementNS(NS, 'text');
    number.textContent = String(n.no);
    g.appendChild(title);
    g.appendChild(circle);
    g.appendChild(number);
    return g;
  }

  function onLabel(n) {
    var on = document.createElement('span');
    on.className = 'on';
    on.title = n.el;
    var name = document.createElement('b');
    name.textContent = n.label;
    on.appendChild(document.createTextNode('on '));
    on.appendChild(name);
    return on;
  }

  function itemFor(n) {
    var write = editable();
    var li = document.createElement('li');
    li.className = 'note';
    li.setAttribute('data-id', n.id);

    var head = document.createElement('div');
    head.className = 'note-head';
    var badge = document.createElement('button');
    badge.type = 'button';
    badge.className = 'badge';
    badge.textContent = String(n.no);
    badge.title = 'Show this note on the drawing';
    badge.setAttribute('aria-label', 'Show note ' + n.no + ' on the drawing');
    head.appendChild(badge);
    head.appendChild(onLabel(n));
    if (write) {
      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.textContent = 'Delete';
      remove.setAttribute('aria-label', 'Delete note ' + n.no);
      remove.addEventListener('click', function () { removeNote(n.id); });
      head.appendChild(remove);
    }

    var textarea = document.createElement('textarea');
    textarea.className = 'text';
    textarea.rows = 2;
    textarea.value = n.text;
    textarea.readOnly = !write;
    textarea.placeholder = write ? 'Write the note' : '';
    textarea.setAttribute('aria-label', 'Note ' + n.no + ', on ' + n.label);
    var meta = document.createElement('p');
    meta.className = 'meta';
    meta.textContent = when(n);

    li.appendChild(head);
    li.appendChild(textarea);
    li.appendChild(meta);

    textarea.addEventListener('input', function () {
      typed(n, textarea.value);
      meta.textContent = when(n);
      grow(textarea);
    });
    textarea.addEventListener('focus', function () { mark(n); });
    textarea.addEventListener('blur', function () {
      mark(n);
      if (mode === 'shared') send(n.id);
      // A note that was just added and got no text goes away once you leave it, unless you are dragging its pin
      // or are back in it (the list is redrawn after a drag, so look up its text box again).
      setTimeout(function () {
        if (fresh !== n.id || dragging === n.id) return;
        var current = list.querySelector('[data-id="' + n.id + '"] textarea');
        if (current && document.activeElement === current) return;
        if (dropEmptyFresh()) render();
      }, 200);
    });
    li.addEventListener('mouseenter', function () { mark(n); });
    li.addEventListener('mouseleave', function () { mark(n); });
    badge.addEventListener('click', function () {
      showPoint(n.x, n.y);
      say('Showing note ' + n.no + ', on ' + n.label + '.');
    });
    requestAnimationFrame(function () { grow(textarea); });
    return li;
  }

  function archivedFor(n) {
    var li = document.createElement('li');
    li.className = 'archived';
    var head = document.createElement('div');
    head.className = 'note-head';
    var chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = String(n.no || '·');
    head.appendChild(chip);
    head.appendChild(onLabel(n));
    var text = document.createElement('p');
    text.className = 'archived-text';
    text.textContent = n.text.trim() || '(no text)';
    var outcome = document.createElement('p');
    outcome.className = 'outcome';
    var done = document.createElement('b');
    done.textContent = 'Resolved: ';
    outcome.appendChild(done);
    outcome.appendChild(document.createTextNode(n.resolution || 'nothing was recorded.'));
    var meta = document.createElement('p');
    meta.className = 'meta';
    meta.textContent = 'Archived ' + dateOf(n.archived);
    li.appendChild(head);
    li.appendChild(text);
    li.appendChild(outcome);
    li.appendChild(meta);
    li.addEventListener('mouseenter', function () { markEl(n.el, true); });
    li.addEventListener('mouseleave', function () { markEl(n.el, false); });
    return li;
  }

  function markEl(el, on) {
    var g = groupFor(el);
    if (g && g.getAttribute('data-kind') !== 'view') g.classList.toggle('is-marked', on);
  }

  // Shows which pin and which box a note in the list belongs to, while it is pointed at or being edited.
  function mark(n) {
    var li = list.querySelector('[data-id="' + n.id + '"]');
    var pin = layer.querySelector('[data-id="' + n.id + '"]');
    var on = !!li && (li.matches(':hover') || li.contains(document.activeElement));
    if (li) li.classList.toggle('is-active', on);
    if (pin) pin.classList.toggle('is-active', on);
    markEl(n.el, on);
  }

  function remember() { shown = JSON.stringify([notes, archive]); }

  // Redraws every pin and list entry. Whoever was typing in a note keeps their place in it.
  function render() {
    pendingRender = false;
    var active = document.activeElement;
    var activeNote = active && active.closest ? active.closest('.note') : null;
    var activeId = activeNote ? activeNote.getAttribute('data-id') : null;
    var selStart = activeId ? active.selectionStart : 0;
    var selEnd = activeId ? active.selectionEnd : 0;
    var marked = svg.querySelectorAll('.is-marked');
    for (var i = 0; i < marked.length; i++) marked[i].classList.remove('is-marked');
    while (layer.firstChild) layer.removeChild(layer.firstChild);
    while (list.firstChild) list.removeChild(list.firstChild);
    while (archiveList.firstChild) archiveList.removeChild(archiveList.firstChild);
    notes.forEach(function (n) {
      layer.appendChild(pinFor(n));
      list.appendChild(itemFor(n));
    });
    for (var j = archive.length - 1; j >= 0; j--) archiveList.appendChild(archivedFor(archive[j]));
    empty.hidden = notes.length > 0;
    count.textContent = notes.length ? String(notes.length) : '';
    archiveBox.hidden = !archive.length;
    archiveCount.textContent = archive.length ? String(archive.length) : '';
    showNotes.textContent = notes.length ? 'Notes · ' + notes.length : 'Notes';
    chrome();
    remember();
    var again = activeId ? list.querySelector('[data-id="' + activeId + '"] textarea') : null;
    if (again) {
      again.focus({ preventScroll: true });
      try { again.setSelectionRange(selStart, selEnd); } catch (error) { /* not a text field */ }
    }
  }

  // The controls that depend on where the notes are kept and whether this viewer can change them.
  function chrome() {
    var write = editable();
    where.textContent = reason || WHERE[mode];
    empty.textContent = mode === 'loading' ? 'Loading the notes…' : write ? EMPTY : 'No notes yet.';
    downloadButton.hidden = mode !== 'local';
    importButton.hidden = !write;
    deleteAll.hidden = !write || !notes.length;
    if (!hovered) hint.textContent = baseHint();
  }

  function setMode(next, why) {
    mode = next;
    reason = why || '';
    render();
  }

  // Takes away the note just added if it has no text. Says whether it did.
  function dropEmptyFresh() {
    var n = noteById(fresh);
    fresh = null;
    if (!n || n.text.trim()) return false;
    forget(n.id);
    return true;
  }

  function setPanel(open) {
    panel.hidden = !open;
    showNotes.hidden = open;
  }

  function focusNote(id) {
    setPanel(true);
    var textarea = list.querySelector('[data-id="' + id + '"] textarea');
    if (!textarea) return;
    textarea.focus({ preventScroll: true });
    textarea.closest('li').scrollIntoView({ block: 'nearest' });
  }

  function removeNote(id) {
    var n = noteById(id);
    if (!n) return;
    forget(id);
    render();
    say('Deleted note ' + n.no + '.');
  }

  // Takes note `id` off the page and out of wherever the notes are kept.
  function forget(id) {
    var n = noteById(id);
    if (n) notes.splice(notes.indexOf(n), 1);
    if (fresh === id) fresh = null;
    if (mode === 'local') saveLocal();
    else if (mode === 'shared') dropShared(id);
  }

  // A tap or click that didn't move: a note on the element under the pointer.
  function addNoteAt(clientX, clientY) {
    if (!editable()) {
      say(mode === 'loading' ? 'The notes are still loading.' : 'Notes can only be read here.');
      return;
    }
    dropEmptyFresh();
    var at = elementOf(document.elementFromPoint(clientX, clientY));
    var point = toDrawing(clientX, clientY);
    var stamp = now();
    var n = {
      id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      no: nextNumber(), el: at.el, label: at.label, x: point.x, y: point.y, text: '', created: stamp, updated: stamp
    };
    notes.push(n);
    fresh = n.id;
    if (mode === 'local') saveLocal();
    else stage(n, FIELDS).unsent = true;
    render();
    focusNote(n.id);
    say('Added note ' + n.no + ' on ' + at.label + '.');
  }

  function typed(n, text) {
    n.text = text;
    n.updated = now();
    remember();
    if (mode === 'local') {
      saveLocal();
    } else if (mode === 'shared') {
      stage(n, ['text', 'updated']);
      clearTimeout(timers[n.id]);
      timers[n.id] = setTimeout(function () { send(n.id); }, PAUSE);
    }
  }

  function placed(n) {
    if (mode === 'local') {
      saveLocal();
    } else if (mode === 'shared') {
      stage(n, PLACE);
      send(n.id);
    }
  }

  // ---- Where the notes are kept. Published on claude.ai: the page's database, shared by everyone who can open
  // the page, where Claude reads them. Opened as a file: this browser, starting from the notes saved in the file.

  function start() {
    var claude = window.claude;
    if (!claude || typeof claude.use !== 'function') {
      startLocal();
      return;
    }
    notes = [];
    archive = [];
    render();
    claude.use('db').then(function (found) {
      if (!found) {
        notes = saved.notes.map(tidy);
        archive = saved.archive;
        setMode('read', 'This view can\'t reach the shared notes. These are the notes saved with the page.');
        return null;
      }
      db = found;
      return claude.use('user').then(function (user) {
        return user ? user.can('data.write') : null;
      }).then(function (allowed) {
        startShared(allowed !== false);
      });
    }).catch(function () {
      if (mode === 'loading') setMode('read', 'The notes couldn\'t be loaded. Reload the page to try again.');
    });
  }

  // -- This browser.

  function readLocal() {
    var data = null;
    try {
      data = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
    } catch (error) {
      warning.hidden = false;
    }
    if (!data || !Array.isArray(data.notes)) return null;
    return {
      base: typeof data.base === 'string' ? data.base : null,
      ids: Array.isArray(data.ids) ? data.ids : [],
      notes: data.notes.filter(isNote).map(tidy)
    };
  }

  function saveLocal() {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify({
        base: saved.saved,
        ids: saved.notes.map(function (n) { return n.id; }),
        notes: notes
      }));
      warning.hidden = true;
    } catch (error) {
      warning.hidden = false;
    }
  }

  // Notes the first version of this page kept in this browser.
  function readLegacy() {
    try {
      var data = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
      if (!Array.isArray(data)) return [];
      return data.filter(isNote).map(tidy).filter(function (n) { return n.text.trim(); });
    } catch (error) {
      return [];
    }
  }

  function dropLegacy() {
    try { localStorage.removeItem(LEGACY_KEY); } catch (error) { /* nothing to drop */ }
  }

  function startLocal() {
    mode = 'local';
    var copy = readLocal();
    var known = {};
    saved.notes.concat(saved.archive).forEach(function (n) { known[n.id] = true; });
    var mine;
    if (copy && copy.base === saved.saved) {
      mine = copy.notes;
    } else {
      // The first visit, or the file has been saved again since: start from the file, and keep the notes added
      // in this browser that the file doesn't have.
      mine = saved.notes.map(tidy).concat(copy ? copy.notes.filter(function (n) {
        return copy.ids.indexOf(n.id) < 0 && !known[n.id];
      }) : []);
    }
    var ids = {};
    mine.forEach(function (n) { ids[n.id] = true; });
    var old = readLegacy().filter(function (n) { return !known[n.id] && !ids[n.id]; });
    notes = numberNew(mine.concat(old), saved.archive).sort(byNumber);
    archive = saved.archive;
    saveLocal();
    if (old.length) dropLegacy();
    render();
  }

  // -- The page's database: a collection `notes` and a collection `archive`, one document per note, named by
  // its id. Claude moves a note it has acted on from `notes` to `archive`, adding `resolution` and `archived`.

  var db = null;
  var remote = { notes: {}, archive: {} }; // what the database last delivered
  var heard = { notes: false, archive: false };
  var waiting = [];  // what waits until both collections have been heard from
  var overlay = {};  // id -> a note changed here that the database hasn't confirmed yet
  var gone = {};     // id -> deleted here, hidden until the database drops it
  var queue = {};    // id -> that note's writes, one at a time
  var timers = {};   // id -> the pause after typing in it

  function startShared(writable) {
    mode = writable ? 'shared' : 'read';
    reason = '';
    var timer = setTimeout(function () {
      if (!heard.notes || !heard.archive) say(SLOW);
    }, 10000);
    whenHeard(function () {
      clearTimeout(timer);
      if (status.textContent === SLOW) say('');
    });
    listen('notes');
    listen('archive');
    render();
    if (writable) whenHeard(adoptLegacy);
  }

  function whenHeard(fn) {
    if (heard.notes && heard.archive) fn();
    else waiting.push(fn);
  }

  function listen(name) {
    db.collection(name).onSnapshot(function (snap) {
      var next = {};
      snap.docs.forEach(function (doc) {
        var body = doc.data();
        if (!body) return;
        var n = { id: doc.id };
        Object.keys(body).forEach(function (key) { if (key !== 'id') n[key] = body[key]; });
        if (isNote(n)) next[doc.id] = name === 'archive' ? tidyArchived(n) : tidy(n);
      });
      remote[name] = next;
      if (name === 'notes') {
        Object.keys(gone).forEach(function (id) { if (!next[id]) delete gone[id]; });
        Object.keys(overlay).forEach(function (id) { if (overlay[id].settled) delete overlay[id]; });
      }
      refresh();
      if (!snap.metadata.fromCache && !heard[name]) {
        heard[name] = true;
        if (heard.notes && heard.archive) waiting.splice(0).forEach(function (fn) { fn(); });
      }
    }, function () {
      setMode('read', 'The notes stopped updating. Reload the page to see the latest ones.');
    });
  }

  // Shows what the database holds, with this page's own unconfirmed changes on top.
  function refresh() {
    var ids = {};
    Object.keys(remote.notes).concat(Object.keys(overlay)).forEach(function (id) { if (!gone[id]) ids[id] = true; });
    var next = Object.keys(ids).map(function (id) { return overlay[id] ? overlay[id].note : remote.notes[id]; }).sort(byNumber);
    var kept = Object.keys(remote.archive).map(function (id) { return remote.archive[id]; }).sort(byArchived);
    if (JSON.stringify([next, kept]) === shown) return;
    notes = next;
    archive = kept;
    if (dragging) pendingRender = true;
    else render();
  }

  // Records a change to note n made here. `fields` are the ones to write.
  function stage(n, fields) {
    var entry = overlay[n.id];
    if (!entry) entry = overlay[n.id] = { note: n, seq: 0, unsent: false, sending: false, dirty: {} };
    entry.note = n;
    entry.seq += 1;
    entry.settled = false;
    fields.forEach(function (field) { entry.dirty[field] = true; });
    return entry;
  }

  // Whether the database already shows note `id` the way it is here.
  function matches(id) {
    var mine = overlay[id] && overlay[id].note;
    var theirs = remote.notes[id];
    return !!mine && !!theirs && FIELDS.every(function (field) { return mine[field] === theirs[field]; });
  }

  // Writes note `id`'s changes. A note added here is written once it has text.
  function send(id) {
    clearTimeout(timers[id]);
    var entry = overlay[id];
    if (!entry || !db) return;
    if (entry.unsent && !entry.note.text.trim()) return;
    if (entry.unsent) entry.sending = true;
    enqueue(id, function () { return flush(id, entry); });
  }

  function flush(id, entry) {
    if (overlay[id] !== entry) return null;
    var keys = Object.keys(entry.dirty);
    var seq = entry.seq;
    var n = entry.note;
    var creating = entry.unsent;
    entry.dirty = {};
    if (!creating && !keys.length) {
      delete overlay[id];
      return null;
    }
    var ref = db.collection('notes').doc(id);
    return attempt(function () {
      return creating ? ref.set(fieldsOf(n, FIELDS)) : ref.update(fieldsOf(n, keys));
    }).then(function () {
      entry.unsent = false;
      // Written. Once the database shows it, the note no longer needs holding here.
      if (overlay[id] === entry && entry.seq === seq) {
        if (matches(id)) delete overlay[id];
        else entry.settled = true;
      }
      refresh();
    }, function (error) {
      if (overlay[id] === entry) delete overlay[id];
      refused(error, id, creating);
      refresh();
    });
  }

  function dropShared(id) {
    clearTimeout(timers[id]);
    var entry = overlay[id];
    delete overlay[id];
    if (entry && entry.unsent && !entry.sending) return; // it was never written
    gone[id] = true;
    enqueue(id, function () {
      return attempt(function () { return db.collection('notes').doc(id).delete(); }).then(function () {
        if (!remote.notes[id]) delete gone[id];
      }, function (error) {
        delete gone[id];
        refused(error, id, false);
        refresh();
      });
    });
  }

  // Runs a note's writes one after another.
  function enqueue(id, job) {
    var next = (queue[id] || Promise.resolve()).then(job, job);
    queue[id] = next;
    var done = function () { if (queue[id] === next) delete queue[id]; };
    next.then(done, done);
  }

  // A write the database couldn't take for a moment gets one more try.
  function attempt(fn) {
    return Promise.resolve().then(fn).catch(function (error) {
      if (!error || error.code !== 'unavailable') throw error;
      return new Promise(function (resolve) { setTimeout(resolve, 400 + Math.random() * 800); }).then(fn);
    });
  }

  // Notes the first version of this page kept in this browser join the shared notes, once.
  function adoptLegacy() {
    if (mode !== 'shared') return;
    var old = readLegacy().filter(function (n) { return !remote.notes[n.id] && !remote.archive[n.id]; });
    if (!old.length) {
      dropLegacy();
      return;
    }
    numberNew(old, notes.concat(archive));
    old.reduce(function (done, n) {
      return done.then(function () {
        return attempt(function () { return db.collection('notes').doc(n.id).set(fieldsOf(n, FIELDS)); });
      });
    }, Promise.resolve()).then(function () {
      dropLegacy();
      say('Moved ' + plural(old.length, 'note') + ' from this browser into the shared notes.');
    }, function (error) {
      refused(error, null, true);
    });
  }

  function refused(error, id, creating) {
    var code = error && error.code;
    if (code === 'invalid_argument' && id && !creating && !remote.notes[id]) {
      say('That note was archived or deleted somewhere else, so the change wasn\'t kept.');
    } else if (code === 'invalid_argument' || code === 'revoked' || code === 'not_granted') {
      setMode('read', 'You can read these notes but not change them.');
    } else if (code === 'quota_exceeded') {
      say('The shared notes are full. Delete some notes, then try again.');
    } else {
      say('A change to the notes wasn\'t saved. Check your connection, then try again.');
    }
  }

  // ---- Moving around: drag the plane with one pointer, pinch with two, or use the wheel.

  var pointers = {};
  var gesture = null;

  function pointerCount() { return Object.keys(pointers).length; }
  function twoPointers() {
    var ids = Object.keys(pointers);
    var a = pointers[ids[0]];
    var b = pointers[ids[1]];
    return { mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, dist: Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1) };
  }
  function startSingle(p, moved) {
    gesture = { x: p.x, y: p.y, cx: camera.x, cy: camera.y, moved: moved, pinch: null };
  }

  svg.addEventListener('pointerdown', function (event) {
    if (event.target.closest('.pin')) return;
    if (event.pointerType === 'mouse' && event.button > 1) return;
    event.preventDefault();
    canvas.focus({ preventScroll: true });
    pointers[event.pointerId] = { x: event.clientX, y: event.clientY, button: event.button };
    try { svg.setPointerCapture(event.pointerId); } catch (error) { /* not capturable */ }
    if (pointerCount() === 1) {
      startSingle(pointers[event.pointerId], event.button === 1);
    } else if (pointerCount() === 2) {
      var t = twoPointers();
      gesture = { moved: true, pinch: { mid: t.mid, dist: t.dist, cx: camera.x, cy: camera.y, k: camera.k } };
    }
  });

  svg.addEventListener('pointermove', function (event) {
    var p = pointers[event.pointerId];
    if (!p) {
      if (!dragging) hover(event);
      return;
    }
    p.x = event.clientX;
    p.y = event.clientY;
    if (!gesture) return;
    if (gesture.pinch) {
      if (pointerCount() < 2) return;
      var s = stageSize();
      var t = twoPointers();
      var g = gesture.pinch;
      var k = clamp(g.k * t.dist / g.dist, MIN_ZOOM, MAX_ZOOM);
      var wx = g.cx + (g.mid.x - s.left) / g.k;
      var wy = g.cy + (g.mid.y - s.top) / g.k;
      camera = { k: k, x: wx - (t.mid.x - s.left) / k, y: wy - (t.mid.y - s.top) / k };
      apply();
      return;
    }
    var dx = p.x - gesture.x;
    var dy = p.y - gesture.y;
    if (!gesture.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    if (!gesture.moved) {
      gesture.moved = true;
      canvas.classList.add('is-panning');
      setHover(null);
    }
    camera = { k: camera.k, x: gesture.cx - dx / camera.k, y: gesture.cy - dy / camera.k };
    apply();
  });

  function endPointer(event) {
    var p = pointers[event.pointerId];
    if (!p) return;
    delete pointers[event.pointerId];
    var left = pointerCount();
    if (left === 1) {
      // From a pinch back to one finger: carry on dragging from here.
      startSingle(pointers[Object.keys(pointers)[0]], true);
      return;
    }
    if (left > 0) return;
    var g = gesture;
    gesture = null;
    canvas.classList.remove('is-panning');
    if (!g || g.moved) return;
    if (event.type === 'pointerup' && p.button === 0) addNoteAt(event.clientX, event.clientY);
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', function (event) {
    event.preventDefault();
    var scale = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? stageSize().height : 1;
    var dx = event.deltaX * scale;
    var dy = event.deltaY * scale;
    if (event.ctrlKey || event.metaKey) {
      zoomAt(Math.exp(-dy * 0.01), event.clientX, event.clientY);
    } else {
      if (event.shiftKey && !dx) { dx = dy; dy = 0; }
      camera = { k: camera.k, x: camera.x + dx / camera.k, y: camera.y + dy / camera.k };
      apply();
    }
  }, { passive: false });

  canvas.addEventListener('keydown', function (event) {
    var step = 80 / camera.k;
    var handled = true;
    switch (event.key) {
      case 'ArrowLeft': camera.x -= step; apply(); break;
      case 'ArrowRight': camera.x += step; apply(); break;
      case 'ArrowUp': camera.y -= step; apply(); break;
      case 'ArrowDown': camera.y += step; apply(); break;
      case '+': case '=': zoomAtCenter(1.25); break;
      case '-': case '_': zoomAtCenter(0.8); break;
      case '0': fit(); break;
      default: handled = false;
    }
    if (handled) event.preventDefault();
  });

  document.getElementById('zoom-in').addEventListener('click', function () { zoomAtCenter(1.25); });
  document.getElementById('zoom-out').addEventListener('click', function () { zoomAtCenter(0.8); });
  document.getElementById('zoom-fit').addEventListener('click', fit);

  function setHover(g) {
    if (hovered === g) return;
    if (hovered) hovered.classList.remove('is-hover');
    hovered = g;
    if (g) g.classList.add('is-hover');
  }

  function hover(event) {
    if (event.target.closest('.pin')) {
      setHover(null);
      hint.textContent = editable() ? 'Drag the pin to move its note, or click it to edit the note.' : 'Click the pin to see its note.';
      return;
    }
    var at = elementOf(event.target);
    setHover(at.g && at.g.getAttribute('data-kind') !== 'view' ? at.g : null);
    if (!at.g) hint.textContent = baseHint();
    else hint.textContent = (editable() ? 'Click to add a note on ' : '') + at.label + ' · drag to move around';
  }
  svg.addEventListener('pointerleave', function () {
    setHover(null);
    hint.textContent = baseHint();
  });

  // ---- Moving a note: drag its pin. Dropped on another element, the note moves to that element.

  layer.addEventListener('mousedown', function (event) { event.preventDefault(); });
  layer.addEventListener('pointerdown', function (event) {
    var g = event.target.closest('.pin');
    if (!g || event.button > 0) return;
    event.preventDefault();
    event.stopPropagation();
    var n = noteById(g.getAttribute('data-id'));
    if (!n) return;
    if (!editable()) {
      focusNote(n.id);
      return;
    }
    var startX = event.clientX;
    var startY = event.clientY;
    var moved = false;
    dragging = n.id;
    g.setPointerCapture(event.pointerId);
    g.classList.add('is-dragging');

    function move(ev) {
      if (!moved && Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) < 4) return;
      moved = true;
      var point = toDrawing(ev.clientX, ev.clientY);
      n.x = point.x;
      n.y = point.y;
      g.setAttribute('transform', pinTransform(n));
    }
    function end(ev) {
      g.removeEventListener('pointermove', move);
      g.removeEventListener('pointerup', end);
      g.removeEventListener('pointercancel', end);
      g.classList.remove('is-dragging');
      dragging = null;
      if (moved) {
        var at = { el: n.el, label: n.label };
        if (ev.type === 'pointerup') {
          g.style.display = 'none';
          at = elementOf(document.elementFromPoint(ev.clientX, ev.clientY));
          g.style.display = '';
        }
        var changed = at.el !== n.el;
        n.el = at.el;
        n.label = at.label;
        n.updated = now();
        placed(n);
        say('Moved note ' + n.no + (changed ? ' to ' + at.label : '') + '.');
      }
      if (moved || pendingRender) render();
      focusNote(n.id);
    }
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', end);
    g.addEventListener('pointercancel', end);
  });

  // ---- Taking notes out and bringing them in.

  function listed(lines, n, after) {
    var parts = (n.text.trim() || '(no text)').split('\n');
    lines.push('- **Note ' + n.no + '** on **' + n.label + '** (`' + n.el + '`): ' + parts[0]);
    for (var j = 1; j < parts.length; j++) lines.push('  ' + parts[j]);
    if (after) after.split('\n').forEach(function (line) { lines.push('  ' + line); });
  }

  function markdown() {
    var lines = [
      '## Notes on proofStructure',
      '',
      'From ' + PAGE + '. Each note names the element of ' + MODEL + ' it is on.',
      ''
    ];
    if (!notes.length) lines.push('No open notes.');
    notes.forEach(function (n) { listed(lines, n); });
    if (archive.length) {
      lines.push('', '### Archive', '');
      archive.forEach(function (n) { listed(lines, n, 'Resolved: ' + (n.resolution || 'nothing was recorded.')); });
    }
    return lines.join('\n') + '\n';
  }

  document.getElementById('copy-markdown').addEventListener('click', function () {
    if (!notes.length && !archive.length) {
      say('There are no notes to copy yet.');
      return;
    }
    var text = markdown();
    var byHand = function () {
      setPanel(true);
      copyBox.hidden = false;
      copyBox.value = text;
      copyBox.focus();
      copyBox.select();
      say('This browser wouldn\'t copy for the page. The Markdown is selected in the notes panel: copy it from there.');
    };
    try {
      navigator.clipboard.writeText(text).then(function () {
        copyBox.hidden = true;
        say('Copied ' + plural(notes.length, 'note') + (archive.length ? ' and the archive' : '') + ' as Markdown.');
      }, byHand);
    } catch (error) {
      byHand();
    }
  });

  // Opened as a file, the page can hand its notes over as a file: the same shape save-notes.mjs takes.
  downloadButton.addEventListener('click', function () {
    if (!notes.length && !archive.length) {
      say('There are no notes to download yet.');
      return;
    }
    var data = { view: VIEW.el, model: MODEL, saved: now(), notes: notes, archive: archive };
    var url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' }));
    var link = document.createElement('a');
    link.href = url;
    link.download = 'stronghold-proof-notes.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    say('Downloading ' + plural(notes.length, 'note') + ' as stronghold-proof-notes.json.');
  });

  importButton.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file || !editable()) return;
    file.text().then(function (raw) {
      var data = JSON.parse(raw);
      var incoming = Array.isArray(data) ? data : data && data.notes;
      if (!Array.isArray(incoming)) throw new Error('no notes');
      var have = {};
      notes.concat(archive).forEach(function (n) { have[n.id] = true; });
      var added = incoming.filter(isNote).map(tidy).filter(function (n) {
        if (have[n.id] || !n.text.trim()) return false;
        have[n.id] = true;
        return true;
      });
      numberNew(added, notes.concat(archive));
      added.forEach(function (n) {
        notes.push(n);
        if (mode === 'shared') {
          stage(n, FIELDS).unsent = true;
          send(n.id);
        }
      });
      notes.sort(byNumber);
      if (mode === 'local') saveLocal();
      render();
      setPanel(true);
      var skipped = incoming.length - added.length;
      say('Imported ' + plural(added.length, 'note') + ' from ' + file.name +
        (skipped ? ', and left out ' + skipped + ' already here, empty, or unreadable.' : '.'));
    }).catch(function () {
      say(file.name + ' isn\'t a notes file from this page.');
    });
  });

  deleteAll.addEventListener('click', function () {
    if (!notes.length || !editable()) return;
    if (performance.now() - armed > 4000) {
      armed = performance.now();
      deleteAll.textContent = 'Click again to delete all ' + notes.length;
      setTimeout(function () {
        if (performance.now() - armed >= 4000) deleteAll.textContent = 'Delete all notes';
      }, 4100);
      return;
    }
    var n = notes.length;
    notes.slice().forEach(function (note) { forget(note.id); });
    armed = -Infinity;
    deleteAll.textContent = 'Delete all notes';
    render();
    say('Deleted ' + plural(n, 'note') + '.');
  });

  document.getElementById('hide-notes').addEventListener('click', function () { setPanel(false); });
  showNotes.addEventListener('click', function () { setPanel(true); });

  // Another tab with this file open changed this browser's notes.
  window.addEventListener('storage', function (event) {
    if (mode !== 'local' || event.key !== LOCAL_KEY) return;
    var copy = readLocal();
    if (!copy || copy.base !== saved.saved) return;
    notes = copy.notes.sort(byNumber);
    render();
  });

  if (window.ResizeObserver) new ResizeObserver(function () { if (camera) apply(); }).observe(canvas);
  else window.addEventListener('resize', function () { if (camera) apply(); });

  hint.textContent = baseHint();
  start();
  if (NARROW.matches && !notes.length) setPanel(false);
  if (camera) apply(); else fit();
})();
</script>
</body>
</html>
