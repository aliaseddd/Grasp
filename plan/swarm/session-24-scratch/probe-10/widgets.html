<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../wt-10/canvas/dist/vendor.css"></head>
<body><div id="root"></div>
<script src="../wt-10/canvas/dist/vendor.js"></script>
<script>
const V = window.GraspVendor;
const React = V['react'];
const h = React.createElement;
const { createRoot } = V['react-dom/client'];
const M = V['@mui/material'];
window.log = [];
function App() {
  const [name, setName] = React.useState('Host');
  const [doc, setDoc] = React.useState('A doc.');
  const [abs, setAbs] = React.useState(false);
  const [dir, setDir] = React.useState('');
  const [tab, setTab] = React.useState('Core');
  const [open, setOpen] = React.useState(false);
  const all = [{ id: '', label: 'nothing yet' }, { id: 'Host', label: 'Host' }, { id: 'ServerHost', label: 'ServerHost' }, { id: 'X2', label: 'Host' }];
  const [ref, setRef] = React.useState(all[1]);
  const options = open ? all : [ref];
  return h('div', { style: { width: 320 } },
    h(M.Tabs, { value: tab, onChange: (e, v) => { window.log.push('tab ' + v); setTab(v); }, 'aria-label': 'Details' },
      h(M.Tab, { value: 'Core', label: 'Core' }), h(M.Tab, { value: 'Advanced', label: 'Advanced' })),
    h(M.TextField, { size: 'small', fullWidth: true, label: 'Declared Name', value: name, placeholder: 'ph',
      onChange: (e) => { window.log.push('change ' + e.target.value); setName(e.target.value); },
      onBlur: () => window.log.push('blur name'),
      onKeyDown: (e) => window.log.push('keydown ' + e.key),
      slotProps: { htmlInput: { 'data-testid': 'field-name', spellCheck: false, autoComplete: 'off' } } }),
    h(M.TextField, { size: 'small', fullWidth: true, multiline: true, minRows: 2, label: 'Documentation', value: doc,
      onChange: (e) => setDoc(e.target.value), slotProps: { htmlInput: { 'data-testid': 'field-doc' } } }),
    h(M.TextField, { size: 'small', fullWidth: true, label: 'Order', value: '3', disabled: true, helperText: 'Locked because.',
      slotProps: { htmlInput: { 'data-testid': 'field-order', readOnly: true } } }),
    h(M.FormControlLabel, { label: 'Is Abstract', control: h(M.Checkbox, { size: 'small', checked: abs,
      onChange: (e) => { window.log.push('check ' + e.target.checked); setAbs(e.target.checked); },
      slotProps: { input: { 'data-testid': 'field-abstract' } } }) }),
    h(M.FormControl, { component: 'fieldset' },
      h(M.FormLabel, { component: 'legend', id: 'dir-label' }, 'Direction'),
      h(M.RadioGroup, { row: true, 'aria-labelledby': 'dir-label', 'data-testid': 'field-direction', name: 'field-direction', value: dir,
        onChange: (e) => { window.log.push('radio ' + JSON.stringify(e.target.value)); setDir(e.target.value); } },
        ['', 'in', 'inout', 'out'].map((v) => h(M.FormControlLabel, { key: v, value: v, label: v || 'unset', control: h(M.Radio, { size: 'small' }) })))),
    h(M.Autocomplete, { size: 'small', fullWidth: true, disableClearable: true, options, value: ref,
      open, onOpen: () => { window.log.push('open'); setOpen(true); }, onClose: (e, reason) => { window.log.push('close ' + reason); setOpen(false); },
      getOptionLabel: (o) => o.label, getOptionKey: (o) => o.id, isOptionEqualToValue: (a, b) => a.id === b.id,
      onChange: (e, v, reason) => { window.log.push('pick ' + JSON.stringify(v) + ' ' + reason); setRef(v); },
      renderOption: (props, o) => { const { key, ...rest } = props; return h('li', { key, ...rest, 'data-option': o.id }, o.label); },
      renderInput: (params) => h(M.TextField, { ...params, label: 'Typed by',
        slotProps: { htmlInput: { ...params.inputProps, 'data-testid': 'field-type', 'data-value': ref.id } } }) }),
  );
}
createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
