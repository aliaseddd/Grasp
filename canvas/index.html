<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stronghold Design Canvas</title>
<!-- A SysML v2 model drawn as views on an endless plane, each view a frame with its own layout of the model's
     elements, with notes on its elements and lines, checks while drawing, undo, and an export to textual SysML v2. Open
     this file in a browser; it needs no server. The model between the model markers and the notes between the notes
     markers are written by save-state.mjs. Published on claude.ai, the page keeps the working model and the notes in
     the page's database, where Claude reads them. README.md in this folder says how. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a bar with the palette along the top, the plane under it, and panels floating on the plane.
   Stronghold's design tokens (app/src/design/tokens.css), with a dark set made from the same ink and teal. */
:root {
  --bg: #EEF2F4;
  --card: #FFFFFF;
  --fg: #182630;
  --fg-2: #5B6973;
  --line: #E2E7EB;
  --line-strong: #CBD3D9;
  --grid: #B9C3CB;
  --accent: #176B61;
  --accent-soft: #E7F1EF;
  --on-accent: #FFFFFF;
  --danger: #B23C3C;
  --shadow: 0 1px 2px rgba(24, 38, 48, 0.12), 0 8px 24px -8px rgba(24, 38, 48, 0.22);
  --sans: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1317; --card: #162128; --fg: #E2E7EB; --fg-2: #A9B4BC; --line: #26343D; --line-strong: #3A4A55;
    --grid: #2C3A44; --accent: #6CB8A9; --accent-soft: #1C3833; --on-accent: #10181D; --danger: #F08A8A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -8px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1317; --card: #162128; --fg: #E2E7EB; --fg-2: #A9B4BC; --line: #26343D; --line-strong: #3A4A55;
  --grid: #2C3A44; --accent: #6CB8A9; --accent-soft: #1C3833; --on-accent: #10181D; --danger: #F08A8A;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -8px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

/* The bar along the top: the name, the palette, and the actions. */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.title { display: grid; gap: 2px; min-width: 0; margin-right: auto; }
.eyebrow { margin: 0; font: 500 11px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font: 600 17px/1.25 var(--sans); }
.palette { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.palette .label { font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-2); margin-right: 2px; }
.palette .sep { width: 1px; height: 22px; background: var(--line-strong); margin: 0 4px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.actions select {
  font: 500 13px/1 var(--sans); color: var(--fg); background: var(--card);
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 6px; max-width: 170px;
}
button {
  font: 600 13px/1 var(--sans);
  color: var(--fg);
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 9px 12px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
button:disabled:hover { border-color: var(--line-strong); color: var(--fg); }
.palette button[data-tool] { font: 500 12.5px/1 var(--mono); padding: 8px 10px; }
.palette button.is-active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .canvas:focus-visible {
  outline: 2px solid var(--accent); outline-offset: -2px;
}

/* The plane: it fills the window under the bar, and everything else floats on it. */
.stage { position: relative; min-height: 0; overflow: hidden; }
.canvas { position: absolute; inset: 0; touch-action: none; cursor: default; outline: none; }
.canvas.is-panning, .canvas.is-panning * { cursor: grabbing !important; }
.canvas.has-tool { cursor: crosshair; }
.canvas.is-pointer:focus-visible { outline: none; }
.palette button.is-active:focus-visible, .badge:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
.stage.has-export .hud { bottom: auto; top: 12px; }
.panel { z-index: 3; }
.export-panel { z-index: 2; }
.show-panel { z-index: 3; }
.canvas svg { display: block; width: 100%; height: 100%; color: var(--fg); user-select: none; -webkit-user-select: none; }
.sysml .plane-dot { fill: var(--grid); }
.sysml.is-far .plane { display: none; }
.sysml text { fill: currentColor; }
.sysml .kw { font: 400 10.5px var(--sans); fill-opacity: 0.72; }
.sysml .name { font: 600 13px var(--sans); }
.sysml .uname { font: 500 12.5px var(--sans); }
.sysml .is-abstract > .name { font-style: italic; }
.sysml .head-c { font: italic 400 10.5px var(--sans); fill-opacity: 0.66; }
.sysml .doc { font: 400 11px var(--sans); fill-opacity: 0.86; }
.sysml .mono { font: 400 11px var(--mono); }
.sysml .rule { stroke: currentColor; stroke-width: 0.75; stroke-opacity: 0.45; }
/* A view's frame holds its content, so these rules name the frame's own children; the content's rules are below. */
.sysml .frame > .outline { fill: none; stroke: currentColor; stroke-width: 1; stroke-opacity: 0.55; pointer-events: none; }
.sysml .frame.is-active > .outline { stroke-opacity: 0.95; }
.sysml .frame.is-selected > .outline { stroke: var(--accent); stroke-width: 2; stroke-opacity: 1; }
.sysml .frame.is-problem > .outline { stroke: var(--danger); stroke-opacity: 1; }
.sysml .frame > text { pointer-events: none; }
.sysml .frame-name { font: 600 12px var(--sans); }
/* The header tab takes the pointer through a clear rectangle over it, so a view can be selected and moved by it. */
.sysml .frame > .tab { fill: transparent; stroke: none; pointer-events: all; cursor: grab; }
.sysml .frame > .pending { font: italic 400 12.5px var(--sans); fill-opacity: 0.6; pointer-events: none; }
.sysml .el { cursor: pointer; }
.sysml .el > .outline { fill: var(--card); stroke: currentColor; stroke-width: 1.25; }
.sysml .el.is-hover > .outline { stroke: var(--accent); }
.sysml .el.is-drop > .outline { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 3; }
.sysml .el.is-source > .outline { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; }
.sysml .el.is-selected > .outline { stroke: var(--accent); stroke-width: 2.5; }
.sysml .port > .outline { fill: var(--card); stroke: var(--accent); stroke-width: 1.5; }
.sysml .port .glyph { fill: none; stroke: var(--accent); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.sysml .rel { cursor: pointer; }
.sysml .rel .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
.sysml .rel .line { fill: none; stroke: currentColor; stroke-width: 1.25; }
.sysml .rel.connection .line { stroke: var(--accent); stroke-width: 1.75; }
.sysml .rel.is-hover .line { stroke: var(--accent); }
.sysml .rel.is-selected .line { stroke: var(--accent); stroke-width: 2.75; }
.sysml .head { fill: var(--card); stroke: currentColor; stroke-width: 1.25; stroke-linejoin: round; }
.sysml .dot { fill: currentColor; }
.sysml .pin { cursor: pointer; }
.sysml .pin circle { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.sysml .pin.is-resolved circle { fill: var(--fg-2); }
.sysml .pin.is-active circle { stroke: var(--fg); stroke-width: 2.5; }
.sysml .pin text { fill: var(--on-accent); font: 600 11px/1 var(--sans); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
/* What the checks found: the offender's outline turns the danger color (even while selected or hovered), and a badge
   beside it says there is something to read in the panel. */
.sysml .el.is-problem > .outline { stroke: var(--danger); }
.sysml .rel.is-problem .line { stroke: var(--danger); }
.sysml .problem { cursor: pointer; }
.sysml .problem circle { fill: var(--danger); stroke: var(--card); stroke-width: 2; }
.sysml .problem text { fill: var(--on-accent); font: 700 11px/1 var(--sans); text-anchor: middle; dominant-baseline: central; pointer-events: none; }

.float { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.hud {
  left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  max-width: min(560px, calc(100% - 240px)); padding: 8px 12px; display: grid; gap: 2px;
}
.hint { margin: 0; font: 400 12.5px/1.4 var(--mono); color: var(--fg-2); overflow-wrap: anywhere; }
.status { margin: 0; font-size: 13px; color: var(--fg); min-height: 0; }
.status:empty { display: none; }
.problems-button { justify-self: start; margin-top: 4px; padding: 5px 9px; font-size: 12px; color: var(--danger); border-color: var(--line); }
.problems-button:hover { color: var(--danger); border-color: var(--danger); }
.zoom {
  right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 4px; padding: 4px;
}
.zoom button { padding: 7px 10px; border-color: transparent; }
.zoom button:hover { border-color: var(--line-strong); }
.zoom output { min-width: 48px; text-align: center; font: 500 12px/1 var(--mono); color: var(--fg-2); font-variant-numeric: tabular-nums; }

/* The panel: what is selected, then the notes. */
.panel {
  top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); width: 340px; max-height: calc(100% - 84px); overflow: auto;
  display: grid; gap: 14px; align-content: start; padding: 14px;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel h2 { margin: 0; display: flex; align-items: baseline; gap: 8px; font: 600 15px/1.3 var(--sans); }
.count { font: 500 12px/1 var(--mono); color: var(--fg-2); }
.hide { padding: 6px 9px; font-size: 12px; }
.show-panel { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); box-shadow: var(--shadow); }
.empty { margin: 0; font-size: 13.5px; color: var(--fg-2); }
.kind { margin: 0; font: 500 12px/1.3 var(--mono); color: var(--accent); overflow-wrap: anywhere; }
.fields { display: grid; gap: 10px; }
.fields label { display: grid; gap: 4px; font: 500 11px/1.2 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--fg-2); }
.fields label.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font: 400 13px/1.3 var(--sans); color: var(--fg); }
.fields input[type="text"], .fields select, .fields textarea {
  width: 100%; font: 400 13.5px/1.4 var(--sans); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
}
.fields textarea { min-height: 54px; resize: vertical; }
.fields input:read-only, .fields textarea:read-only { background: transparent; }
.fields input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.fields .view-options { display: grid; gap: 10px; }
.meta { margin: 0; font: 400 11.5px/1.3 var(--mono); color: var(--fg-2); overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.danger { color: var(--danger); border-color: var(--line); }
.danger:hover { color: var(--danger); border-color: var(--danger); }
.notes { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.note { display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
.note.is-active { border-color: var(--accent); }
.note.is-resolved { border-style: dashed; }
.note-head { display: flex; align-items: center; gap: 8px; }
.badge {
  flex: none; width: 24px; height: 24px; padding: 0; border: none; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font: 600 11px/1 var(--sans);
}
.badge:hover { color: var(--on-accent); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
.is-resolved .badge { background: var(--fg-2); }
.on { flex: 1; min-width: 0; font-size: 12.5px; color: var(--fg-2); overflow-wrap: anywhere; }
.on b { font-weight: 600; color: var(--fg); }
.remove { padding: 6px 8px; font-size: 12px; color: var(--fg-2); border-color: var(--line); }
.remove:hover { color: var(--danger); border-color: var(--danger); }
textarea.text {
  width: 100%; min-height: 60px; resize: vertical;
  font: 400 13.5px/1.5 var(--sans); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
}
textarea.text[readonly] { resize: none; background: transparent; }
.response { margin: 0; padding: 6px 10px; border-left: 2px solid var(--accent); font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.response b { font-weight: 600; color: var(--accent); }
.where { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--fg-2); }
.where:empty { display: none; }
.warning { margin: 0; font-size: 13px; color: var(--danger); }

/* The export: the model as textual SysML v2, in a sheet along the bottom. */
.export-panel {
  left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px));
  width: min(760px, calc(100% - 24px)); max-height: calc(100% - 24px);
  display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; padding: 14px;
}
.problems { margin: 0; padding: 0 0 0 18px; color: var(--danger); font-size: 13px; line-height: 1.45; }
.problems:empty { display: none; }
.code {
  width: 100%; min-height: 160px; height: 38vh; resize: vertical;
  font: 400 12px/1.5 var(--mono); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px; white-space: pre; overflow: auto;
}
/* What the slices add to the look: their shapes, lines, rows and panel sections, one region each. */
/* ==== slice: interconnection ==== */
/* ==== end slice: interconnection ==== */
/* ==== slice: behavior ==== */
/* ==== end slice: behavior ==== */
/* ==== slice: sequence ==== */
/* ==== end slice: sequence ==== */
/* ==== slice: geometry ==== */
/* ==== end slice: geometry ==== */
/* ==== slice: grid ==== */
/* ==== end slice: grid ==== */
/* ==== slice: browser ==== */
/* ==== end slice: browser ==== */
/* ==== slice: annotations ==== */
/* ==== end slice: annotations ==== */
@media (max-width: 720px) {
  /* On a phone the palette is one row that scrolls sideways, so the bar stays short. */
  .top { gap: 8px 12px; }
  .title { flex: 1 1 100%; }
  .palette, .actions { flex: 1 1 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .palette .label { display: none; }
  .palette button[data-tool], .actions button { white-space: nowrap; flex: none; }
  .panel { top: auto; left: 12px; right: 12px; width: auto; bottom: 64px; max-height: 46%; }
  .hud { max-width: calc(100% - 136px); bottom: auto; top: 12px; }
  .show-panel { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .export-panel { bottom: 64px; max-height: 60%; }
  .code { height: 30vh; }
}
@media (prefers-reduced-motion: no-preference) {
  .sysml .el > .outline, .sysml .rel .line { transition: stroke 120ms ease; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">
      <p class="eyebrow">SysML v2 · general view</p>
      <h1>Stronghold Design Canvas</h1>
    </div>
    <!-- The palette's buttons are made by the page from the active view's kind: button[data-tool] per tool, span.sep
         between groups. -->
    <div class="palette" role="toolbar" aria-label="Draw">
      <span class="label">Add</span>
    </div>
    <div class="actions">
      <button type="button" id="undo" disabled title="Nothing to undo">Undo</button>
      <button type="button" id="new-view">New view</button>
      <select id="new-view-kind" aria-label="The kind of the new view"></select>
      <!-- ==== slice: interconnection ==== -->
      <!-- ==== end slice: interconnection ==== -->
      <!-- ==== slice: behavior ==== -->
      <!-- ==== end slice: behavior ==== -->
      <!-- ==== slice: sequence ==== -->
      <!-- ==== end slice: sequence ==== -->
      <!-- ==== slice: geometry ==== -->
      <!-- ==== end slice: geometry ==== -->
      <!-- ==== slice: grid ==== -->
      <!-- ==== end slice: grid ==== -->
      <!-- ==== slice: browser ==== -->
      <!-- ==== end slice: browser ==== -->
      <!-- ==== slice: annotations ==== -->
      <!-- ==== end slice: annotations ==== -->
      <button type="button" id="export">Export SysML</button>
      <button type="button" id="download-state" hidden>Download state</button>
      <button type="button" id="import-state" hidden>Import state</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <div class="stage">
    <div class="canvas" id="canvas" tabindex="0" aria-label="The drawing on a plane. Arrow keys move around, plus and minus zoom, 0 fits the drawing, Escape puts a tool down, Delete removes the selection, Ctrl+Z undoes.">
      <svg id="drawing" class="sysml" viewBox="0 0 1200 800" role="img" aria-label="SysML v2 views on a plane"></svg>
    </div>

    <div class="float hud">
      <p class="hint" id="hint"></p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button type="button" class="problems-button" id="problems" hidden title="Select what has a problem; click again for the next">0 problems</button>
    </div>

    <div class="float zoom" role="group" aria-label="Zoom">
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <output id="zoom-level">100%</output>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-fit">Fit</button>
    </div>

    <button type="button" class="show-panel" id="show-panel" hidden>Panel</button>
    <aside class="float panel" id="panel" aria-label="Selection and notes">
      <section id="inspector" aria-labelledby="inspector-title">
        <div class="panel-head">
          <h2 id="inspector-title">Selection</h2>
          <button type="button" class="hide" id="hide-panel">Hide</button>
        </div>
        <p class="empty" id="inspector-empty">Nothing selected. Click a box, a port, or a line.</p>
        <div class="fields" id="fields" hidden>
          <p class="kind" id="f-kind"></p>
          <label id="l-name">Name <input type="text" id="f-name" autocomplete="off" spellcheck="false"></label>
          <label class="check" id="l-abstract"><input type="checkbox" id="f-abstract"> abstract</label>
          <label id="l-type">Defined by <select id="f-type"></select></label>
          <label class="check" id="l-type-line"><input type="checkbox" id="f-type-line"> draw the defined-by line</label>
          <label id="l-multiplicity">Multiplicity <input type="text" id="f-multiplicity" autocomplete="off" spellcheck="false" placeholder="1, 0..1, or 1..*"></label>
          <label class="check" id="l-conjugated"><input type="checkbox" id="f-conjugated"> conjugated (~), the other side of the port</label>
          <label id="l-doc">Doc <textarea id="f-doc" rows="2" spellcheck="true"></textarea></label>
          <label id="l-direction">Direction <select id="f-direction"><option value="">undirected</option><option value="in">in</option><option value="out">out</option><option value="inout">inout</option></select></label>
          <label id="l-item">Item (the payload) <select id="f-item"></select></label>
          <!-- Each slice's fields: <label id="l-<field>">… <input id="f-<field>"></label>, one per row of FIELDS. -->
          <!-- ==== slice: interconnection ==== -->
          <!-- ==== end slice: interconnection ==== -->
          <!-- ==== slice: behavior ==== -->
          <!-- ==== end slice: behavior ==== -->
          <!-- ==== slice: sequence ==== -->
          <!-- ==== end slice: sequence ==== -->
          <!-- ==== slice: geometry ==== -->
          <!-- ==== end slice: geometry ==== -->
          <!-- ==== slice: grid ==== -->
          <!-- ==== end slice: grid ==== -->
          <!-- ==== slice: browser ==== -->
          <!-- ==== end slice: browser ==== -->
          <!-- ==== slice: annotations ==== -->
          <!-- ==== end slice: annotations ==== -->
          <p class="meta" id="f-path"></p>
          <p class="meta" id="f-views"></p>
          <div class="row">
            <button type="button" id="add-note">Add note</button>
            <button type="button" id="remove-from-view" title="Take it out of this view. It stays in the model and in the other views.">Remove from view</button>
            <button type="button" class="danger" id="delete-selected">Delete</button>
          </div>
        </div>
        <div class="fields" id="view-fields" hidden>
          <p class="kind" id="v-kind"></p>
          <label id="l-v-name">Name <input type="text" id="v-name" autocomplete="off" spellcheck="false"></label>

        const k = M.KINDS[kind];
        const L = viewLayout(view.id);
        let el;
        if (k.onBorder) {
          const under = hit.type === 'el' ? layout.ids.get(hit.id) : null;
          let host = under && M.canContain(under.kind, kind) ? under.id : containerAt(L, p, null, kind);
          if (under && M.KINDS[under.kind].onBorder) host = under.owner !== undefined && M.canContain(layout.ids.get(under.owner).kind, kind) ? under.owner : null;
          if (!host || !view.layout[host]) { say('Click a part def or a part in this view to put a ' + k.label + ' on its border.'); return null; }
          const b = nearestBorder(L.rects.get(host), p);
          el = freshElement(kind, freeName(kind, host));
          el.owner = host;
          view.layout[el.id] = { side: b.side, at: b.at };
        } else {
          const w = k.size[0];
          const h = k.size[1];
          const host = containerAt(L, p, null, kind);
          el = freshElement(kind, freeName(kind, host));
          const lay = { x: Math.round(p.x - view.x - w / 2), y: Math.round(p.y - view.y - 20), w: w, h: h };
          if (host) {
            const r = L.rects.get(host);
            el.owner = host;
            lay.x = Math.max(PAD, Math.round(p.x - r.x - w / 2));
            lay.y = Math.max(CHILD_TOP, Math.round(p.y - r.y - 20));
          }
          view.layout[el.id] = lay;
        }
        model.elements.push(el);
        return el;
      },
      dragStart: function (view, el, p) {
        const lay = view.layout[el.id];
        if (!lay) return null;
        const from = M.KINDS[el.kind].onBorder ? { side: lay.side, at: lay.at } : { x: lay.x, y: lay.y };
        return { kind: 'el', id: el.id, view: view.id, start: p, from: from, moved: false, over: undefined };
      },
      drag: function (view, el, d, p) {
        const lay = view.layout[el.id];
        const L = viewLayout(view.id);
        if (M.KINDS[el.kind].onBorder) {
          const b = nearestBorder(L.rects.get(el.owner), p);
          lay.side = b.side;
          lay.at = b.at;
          return;
        }
        lay.x = Math.round(d.from.x + (p.x - d.start.x));
        lay.y = Math.round(d.from.y + (p.y - d.start.y));
        d.over = containerAt(L, p, el, el.kind);
      },
      drop: function (view, el, d, p, event) {
        const lay = view.layout[el.id];
        const L = viewLayout(view.id);
        const what = M.describe(model, el);
        if (M.KINDS[el.kind].onBorder) return { undo: 'Moved ' + what + ' to the ' + lay.side + ' side', text: 'Moved ' + what + ' to the ' + lay.side + ' side', key: 'move:' + el.id };
        // Dropped inside another view's frame: the box goes back where it was. Showing it there is the Show list's job.
        const other = event.type === 'pointerup' ? viewAt(p, view.id) : null;
        if (other) {
          lay.x = d.from.x;
          lay.y = d.from.y;
          return { say: 'A box doesn\'t move into another view by dragging, so it went back. To show it in ' + M.describeView(model, viewById(other)) + ', select that view and use its Show list.' };
        }
        if (event.type === 'pointerup') {
          // The box it is dropped in, against the box it sat in here: another one, or none, changes its owner in the
          // model, and its place is read against the new parent's box. A box whose owner this view doesn't show sits
          // on the view's ground, and stays owned when moved about on it.
          const over = containerAt(L, p, el, el.kind);
          const visual = L.parentOf.get(el.id) || null;
          if (over === visual && visual !== null) { lay.x = Math.max(lay.x, PAD); lay.y = Math.max(lay.y, CHILD_TOP); }
          if (over !== visual) {
            const abs = L.rects.get(el.id);
            if (over === null) { delete el.owner; lay.x = Math.round(abs.x - view.x); lay.y = Math.round(abs.y - view.y); }
            else {
              const o = L.rects.get(over);
              el.owner = over;
              lay.x = Math.max(PAD, Math.round(abs.x - o.x));
              lay.y = Math.max(CHILD_TOP, Math.round(abs.y - o.y));
            }
            const text = 'Moved ' + what + (over ? ' into ' + M.describe(model, layout.ids.get(over)) : ' out onto the plane');
            return { undo: text, text: text, key: null };
          }
        } else if (L.parentOf.get(el.id)) { lay.x = Math.max(lay.x, PAD); lay.y = Math.max(lay.y, CHILD_TOP); }

      }
    },
    // A view whose kind has no renderer yet: the frame at its minimum size, saying so.
    pending: {
      layout: function (view) {
        return { view: view, shown: new Set(), kids: new Map(), parentOf: new Map(), rects: new Map(), comps: new Map(), frameRect: frameAround(view, null) };
      },
      draw: function (view, g, L) {
        const fr = L.frameRect;
        g.appendChild(text(fr.x + fr.w / 2, fr.y + fr.h / 2, 'A ' + M.VIEW_KINDS[view.kind].label + ' is not drawn yet.', 'pending', 'middle'));
      },
      place: function (view, kind) { say('A ' + M.KINDS[kind].label + ' can\'t be drawn in a ' + M.VIEW_KINDS[view.kind].label + ' yet.'); return null; },

      drag: function () {},
      drop: function () { return null; }

  // A new element of a kind, with the fields its kind has, each at its starting value.
  function freshElement(kind, name) {
    const el = { id: newId('e'), kind: kind, name: name, doc: '' };
    M.KINDS[kind].fields.forEach((fld) => { if (el[fld] === undefined) blankField(el, fld); });
    return el;
  }
  // Gives item the starting value of a field, by its row in FIELDS: what fresh() returns when the row has one, else
  // false for a bool, the first value of an enum, '' for the rest; a field that isn't stored as a value (type) gets
  // nothing, and so does a field with no row.
  function blankField(item, fld) {
    const spec = M.FIELDS[fld];
    if (!spec || spec.stored === false) return;
    if (spec.fresh) item[fld] = spec.fresh();
    else if (spec.type === 'bool') item[fld] = false;
    else if (spec.type === 'enum') item[fld] = spec.values[0];
    else item[fld] = '';
  }

  // ---- The slices' regions: everything a slice adds to the page goes in its own, in this order. The tables above
  // are const objects, so assigning into them works here (SHAPES.diamond = …, RENDERERS.sequence = {…}, Object.assign(
  // TOOL_TITLE, {…}), COMPARTMENTS.push(…), MARKERS['m-flow'] = …, ROUTES.x = …, ACTIONS.toggle = …, VIEW_PANELS.
  // GridView = …, TOOLS.Note = …), function declarations hoist, so a slice may call any function of this script, and
  // start() runs at the end of the script, after every region.
  // ==== slice: interconnection ====
  // ==== end slice: interconnection ====
  // ==== slice: behavior ====
  // ==== end slice: behavior ====
  // ==== slice: sequence ====
  // ==== end slice: sequence ====
  // ==== slice: geometry ====
  // ==== end slice: geometry ====
  // ==== slice: grid ====
  // ==== end slice: grid ====
  // ==== slice: browser ====
  // ==== end slice: browser ====
  // ==== slice: annotations ====
  // ==== end slice: annotations ====

  // Where a note's pin sits in view layout L: on the top edge of a box, beside a port's square away from its name, on
  // the middle of a line. Pins on the same thing step aside by a screen distance, so they stay apart when zoomed out.
  // A note on a defined-by line that isn't drawn sits on the part or port the line starts from. Null when the note's
  // target isn't drawn in the view.
  function pinAnchor(n, k, L) {
    const step = 26 / (camera ? camera.k : 1) * k;
    const r = L.rects.get(n.target);
    if (r) {
      if (!r.port) return { x: r.x + r.w - 10 - step, y: r.y };
      if (r.side === 'right') return { x: r.cx + 16 + step, y: r.cy + 14 };
      if (r.side === 'left') return { x: r.cx - 16 - step, y: r.cy - 14 };
      return { x: r.cx + 18 + step, y: r.cy };
    }
    const rel = relById(n.target);
    if (!rel) return null;
    if (rel.hidden) { const from = L.rects.get(rel.from); return from ? { x: (from.port ? from.cx : from.x) + 12 + step, y: (from.port ? from.cy : from.y) - 16 } : null; }
    const e = endpoints(rel, L);
    return e ? { x: e.mid.x + step, y: e.mid.y } : null;
  }
  function pinTransform(x, y) { return 'translate(' + f(x) + ' ' + f(y) + ') scale(' + (1 / (camera ? camera.k : 1)).toFixed(4) + ')'; }
  function drawPins(layer) {
    while (layer.firstChild) layer.removeChild(layer.firstChild);
    const seen = {};
    for (const n of notes.slice().sort(byNumber)) {
      layout.views.forEach((L) => {
        const key = L.view.id + '/' + n.target;
        const k = seen[key] || 0;
        const at = pinAnchor(n, k, L);
        if (!at) return;
        seen[key] = k + 1;
        const g = node('g', { 'data-note': n.id, 'data-view': L.view.id, 'data-x': f(at.x), 'data-y': f(at.y), transform: pinTransform(at.x, at.y) }, 'pin' + (n.resolved ? ' is-resolved' : ''));
        const title = node('title');
        title.textContent = 'Note ' + n.no + ' on ' + (M.labelFor(model, n.target) || n.targetLabel) + '. Click to read it.';
        const circle = node('circle', { r: 11 });
        const number = node('text');
        number.textContent = String(n.no);
        g.appendChild(title);
        g.appendChild(circle);
        g.appendChild(number);
        layer.appendChild(g);
      });
    }
  }
  // The ids a problem is shown on: what it names, and, for a defined-by line that isn't drawn, the part or port the
  // line starts from, since the line itself can't be pointed at.
  function marksFor(p) {
    if (p.id === null) return [];
    const rel = relById(p.id);
    return rel && rel.hidden ? [p.id, rel.from] : [p.id];
  }
  // Where a problem's badge sits in view layout L: at a box's top-right corner, inside a port's corner, above the
  // middle of a line, on a view's tab. Null when the offender isn't drawn in the view.
  function badgeAnchor(id, L) {
    if (id === L.view.id) { const fr = L.frameRect; return { x: fr.x + 2, y: fr.y + 2 }; }
    const r = L.rects.get(id);
    if (r) {
      if (!r.port) return { x: r.x + r.w + 2, y: r.y - 2 };
      if (r.side === 'right') return { x: r.cx - 16, y: r.cy - 14 };
      if (r.side === 'left') return { x: r.cx + 16, y: r.cy + 14 };
      return { x: r.cx - 18, y: r.cy };
    }
    const rel = relById(id);
    if (!rel || rel.hidden) return null;
    const e = endpoints(rel, L);
    return e ? { x: e.mid.x, y: e.mid.y - 14 } : null;
  }
  function drawBadges(layer) {
    while (layer.firstChild) layer.removeChild(layer.firstChild);
    const byTarget = new Map();
    problems.forEach((p) => marksFor(p).forEach((id) => { if (!byTarget.has(id)) byTarget.set(id, []); byTarget.get(id).push(p.message); }));
    byTarget.forEach((messages, id) => {
      layout.views.forEach((L) => {
        const at = badgeAnchor(id, L);
        if (!at) return;
        const g = node('g', { 'data-for': id, 'data-view': L.view.id, transform: pinTransform(at.x, at.y) }, 'problem');
        const title = node('title');
        title.textContent = messages.join(' ');
        const mark = node('text');
        mark.textContent = '!';
        g.appendChild(title);
        g.appendChild(node('circle', { r: 9 }));
        g.appendChild(mark);
        layer.appendChild(g);
      });
    });
  }
  function markProblems() {
    const ids = new Set();
    problems.forEach((p) => marksFor(p).forEach((id) => ids.add(id)));
    ids.forEach((id) => svg.querySelectorAll('[data-el="' + id + '"], [data-rel="' + id + '"], .frame[data-view="' + id + '"]').forEach((g) => g.classList.add('is-problem')));
  }
  // Pins and badges are drawn at screen size, so they are drawn again whenever the camera moves.
  function renderPins() {
    const pins = svg.querySelector('.pins');
    const badges = svg.querySelector('.problems');
    if (pins) drawPins(pins);
    if (badges) drawBadges(badges);
  }

  // Redraws the whole drawing from the model, and checks it. The panel is drawn separately, so typing in it isn't
  // interrupted.
  function render() {
    layout = computeLayout();
    const found = M.validate(model);
    if (JSON.stringify(found) !== JSON.stringify(problems)) problemCursor = -1;
    problems = found;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(defs());
    svg.appendChild(node('rect', { x: -100000, y: -100000, width: 200000, height: 200000, fill: 'url(#plane-dots)' }, 'plane'));
    // Each view in its frame, then the pins and the badges on top of everything.
    model.views.forEach((view) => svg.appendChild(drawFrame(view, layout.views.get(view.id))));
    const pins = node('g', {}, 'pins');
    const badges = node('g', {}, 'problems');
    svg.appendChild(pins);
    svg.appendChild(badges);
    drawPins(pins);
    drawBadges(badges);
    markProblems();
    applyMarks();
    problemsButton.hidden = !problems.length;
    problemsButton.textContent = plural(problems.length, 'problem');
    renderProblemsList();
    if (camera) applyCamera(); else fit();
  }
  // Every group that draws the selection: an element or line may be drawn in several frames.
  function groupsFor(sel) {
    if (!sel) return [];
    const q = sel.type === 'view' ? '.frame[data-view="' + sel.id + '"]' : sel.type === 'el' ? '[data-el="' + sel.id + '"]' : '[data-rel="' + sel.id + '"]';
    return Array.from(svg.querySelectorAll(q));
  }
  function applyMarks() {
    svg.querySelectorAll('.is-selected, .is-source').forEach((g) => { g.classList.remove('is-selected'); g.classList.remove('is-source'); });
    groupsFor(selection).forEach((g) => g.classList.add('is-selected'));
    if (pending) svg.querySelectorAll('[data-el="' + pending + '"]').forEach((g) => g.classList.add('is-source'));
  }

  // ---- The camera.

  function readCamera() {
    try {
      const c = JSON.parse(localStorage.getItem(CAMERA_KEY) || 'null');
      if (c && isFinite(c.x) && isFinite(c.y) && isFinite(c.k) && c.k > 0) return { x: +c.x, y: +c.y, k: clamp(+c.k, MIN_ZOOM, MAX_ZOOM) };
    } catch (error) { /* start fitted */ }
    return null;
  }
  function stageSize() {
    const r = canvas.getBoundingClientRect();
    return { left: r.left, top: r.top, width: Math.max(r.width, 1), height: Math.max(r.height, 1) };
  }
  // The part of the window the panel doesn't cover.
  function openArea() {
    const s = stageSize();
    const area = { x: 0, y: 0, width: s.width, height: s.height };
    if (!panel.hidden && s.width > 720) area.width = Math.max(200, s.width - panel.offsetWidth - 24);
    if (s.width <= 720) {
      area.y = hud.offsetHeight + 20;
      area.height = Math.max(160, s.height - area.y - 60 - (panel.hidden ? 0 : panel.offsetHeight + 12));
    }
    return area;
  }
  function applyCamera() {
    const s = stageSize();
    svg.setAttribute('viewBox', [camera.x, camera.y, s.width / camera.k, s.height / camera.k].map((v) => v.toFixed(2)).join(' '));
    svg.classList.toggle('is-far', camera.k < 0.35);
    zoomLevel.textContent = Math.round(camera.k * 100) + '%';
    if (layout) renderPins();
    try { localStorage.setItem(CAMERA_KEY, JSON.stringify(camera)); } catch (error) { /* a convenience only */ }
  }
  // Fits every frame into the open part of the window.
  function fit() {
    if (!layout) render();
    const area = openArea();
    const fr = layout.bounds;
    const k = clamp(Math.min(area.width / fr.w, area.height / fr.h) * 0.94, MIN_ZOOM, MAX_ZOOM);
    camera = { k: k, x: fr.x + fr.w / 2 - (area.x + area.width / 2) / k, y: fr.y + fr.h / 2 - (area.y + area.height / 2) / k };
    applyCamera();
  }
  function zoomAt(factor, clientX, clientY) {
    const s = stageSize();
    const px = clientX - s.left;
    const py = clientY - s.top;
    const wx = camera.x + px / camera.k;
    const wy = camera.y + py / camera.k;
    const k = clamp(camera.k * factor, MIN_ZOOM, MAX_ZOOM);
    camera = { k: k, x: wx - px / k, y: wy - py / k };
    applyCamera();
  }

    const area = openArea();
    zoomAt(factor, s.left + area.x + area.width / 2, s.top + area.y + area.height / 2);
  }
  function showPoint(x, y) {
    const area = openArea();

    applyCamera();
  }

    const point = new DOMPoint(clientX, clientY).matrixTransform(svg.getScreenCTM().inverse());
    return { x: point.x, y: point.y };
  }

  // ---- Changes: what was done, for Claude to read; when to save; and what Undo takes back.

  let saveTimer = null;
  function logChange(what, coalesceKey) {
    const entry = { at: now(), text: what };
    if (coalesceKey) {
      entry.key = coalesceKey;
      const last = changes[changes.length - 1];
      if (last && last.key === coalesceKey) { changes[changes.length - 1] = entry; return; }
    }
    changes.push(entry);
    if (changes.length > 200) changes = changes.slice(-200);
  }
  function changed() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, PAUSE);
  }

  function snapshot() { return JSON.stringify(model); }
  // Remembers the model as it was before a change, so Undo can bring it back. before is that model's JSON, taken
  // with snapshot() before the mutation; without it, the model as it is now, so then call it before mutating. A key
  // joins a run of small changes (the keystrokes of one name) into one step: while the top entry has the same key it
  // is kept and only its text changes. A change without the key, or endEdit(), ends the run.
  function commit(what, key, before) {
    const top = history[history.length - 1];
    if (key && top && top.key === key) { top.what = what; updateUndo(); return; }
    history.push({ json: before === undefined ? snapshot() : before, what: what, key: key || null });
    if (history.length > HISTORY) history.shift();

    const top = history[history.length - 1];

  // After the model was swapped for another (undo, the store, an import): the active view and the selection are kept

  function modelReplaced() {
    if (!viewById(active)) active = model.views[0].id;
    if (pending && !model.elements.some((e) => e.id === pending)) pending = null;

    if (selection && !resolve(selection)) selection = null;
    setActive(active);
    applyMarks();
    renderInspector();
    renderNotes();
    updateUndo();
  }

  // ---- Tools: adding elements and drawing relationships.

  function setTool(next) {
    tool = tool === next ? null : next;
    pending = null;
    paletteButtons().forEach((b) => b.classList.toggle('is-active', b.getAttribute('data-tool') === tool));
    canvas.classList.toggle('has-tool', !!tool);
    applyMarks();
    hint.textContent = baseHint();
  }
  function toolHint(kind, step) {
    const h = TOOL_HINT[kind];
    if (M.KINDS[kind]) return h || 'Click where the ' + M.KINDS[kind].label + ' goes.';
    if (typeof h === 'string') return h; // a tool of TOOLS, with one hint
    return (h || ['Click the first end…', 'Now click the other end.'])[step];
  }

    if (tool) return toolHint(tool, pending ? 1 : 0);
    if (!editable()) return 'Drag to move around · scroll to pan · pinch or Ctrl/⌘ + scroll to zoom';
    const view = activeView();
    if (view && !M.VIEW_KINDS[view.kind].tools.length) return 'Nothing can be drawn in a ' + M.VIEW_KINDS[view.kind].label + ' yet · click another frame to draw there';
    return NARROW.matches

      : 'Click to select · drag a box to move it · drag the plane to move around · Ctrl/⌘ + scroll to zoom';
  }

    let i = 1;
    while (taken.has(base + i)) i++;
    return base + i;
  }
  // The palette follows the active view's kind: a button per tool its kind offers, a rule between the groups.
  let paletteKind = null;
  function buildPalette() {
    const view = activeView();
    paletteKind = view ? view.kind : null;
    paletteButtons().forEach((b) => b.remove());
    palette.querySelectorAll('.sep').forEach((s) => s.remove());
    const tools = view ? M.VIEW_KINDS[view.kind].tools : [];
    // The free tools (TOOLS: the Note tool) follow the kind's own in every palette, while the page is editable.
    const free = editable() ? Object.keys(TOOLS) : [];
    palette.querySelector('.label').hidden = !tools.length && !free.length;
    const sep = () => {
      const s = document.createElement('span');
      s.className = 'sep';
      s.setAttribute('aria-hidden', 'true');
      palette.appendChild(s);
    };

      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-tool', t);
      b.title = TOOL_TITLE[t] || '';
      b.textContent = M.KINDS[t] ? M.KINDS[t].label : M.RELATIONSHIPS[t] ? M.RELATIONSHIPS[t].label : t;
      b.disabled = !editable();
      b.classList.toggle('is-active', t === tool);
      palette.appendChild(b);
    };
    tools.forEach((t) => { if (t === '|') sep(); else button(t); });
    if (free.length) {
      if (tools.length) sep(); // a rule between the kind's tools and the free ones, never one at the start
      free.forEach((t) => button(t));

  palette.addEventListener('click', (event) => {
    const b = event.target.closest ? event.target.closest('button[data-tool]') : null;
    if (!b || !editable()) return;
    setTool(b.getAttribute('data-tool'));
    canvas.focus({ preventScroll: true });
    if (tool) say('');
  });
  // The active view is the one tools add into: shown with is-active, named in the eyebrow, its kind's tools in the
  // palette.
  function setActive(id) {
    const view = viewById(id) || model.views[0];

  }

  // Delete takes an element out of the model and every view, with everything inside it and every line on it; a line
  // out of the model; a view off the plane, its elements staying.
  function deleteSelection() {
    const s = resolve(selection);
    if (!s || !editable()) return;
    if (s.type === 'view') { deleteView(s.item); return; }
    const before = snapshot();
    let gone = [];
    let what;
    let dropped;
    if (s.type === 'el') {
      what = M.describe(model, s.item);
      gone = [s.item].concat(M.descendants(model, s.item.id));
      const ids = new Set(gone.map((e) => e.id));
      const rels = model.relationships.filter((r) => ids.has(r.from) || ids.has(r.to));
      rels.forEach((r) => ids.add(r.id));
      model.elements = model.elements.filter((e) => !ids.has(e.id));
      model.relationships = model.relationships.filter((r) => !ids.has(r.id));
      model.views.forEach((v) => ids.forEach((id) => { delete v.layout[id]; }));
      if (pending && ids.has(pending)) pending = null;
      dropped = dropNotesOn(ids);
    } else {
      what = 'the ' + M.describeRel(model, s.item);
      model.relationships = model.relationships.filter((r) => r.id !== s.item.id);
      dropped = dropNotesOn(new Set([s.item.id]));
    }
    commit('Deleted ' + what, null, before);
    logChange('Deleted ' + what);
    select(null);
    render();
    renderNotes();
    changed();
    say('Deleted ' + what + (gone.length > 1 ? ', with ' + plural(gone.length - 1, 'element') + ' inside it' : '') +
      (dropped ? ', and ' + plural(dropped, 'note') + ' on it' : '') + '.');
  }
  deleteButton.addEventListener('click', deleteSelection);
  undoButton.addEventListener('click', undo);
  function dropNotesOn(ids) {
    const on = notes.filter((n) => ids.has(n.target));
    on.forEach((n) => removeNote(n.id, true));
    return on.length;
  }

  function setPanel(open) {
    panel.hidden = !open;
    showPanel.hidden = open;
  }
  $('hide-panel').addEventListener('click', () => setPanel(false));
  showPanel.addEventListener('click', () => setPanel(true));

  // ---- Notes: on an element or a line, listed in the panel, pinned on the drawing wherever their target is drawn.

  const noteTimers = {};
  function renderNotes() {
    const active = document.activeElement;
    const activeLi = active && active.closest ? active.closest('.note') : null;
    const activeId = activeLi ? activeLi.getAttribute('data-note') : null;
    const selStart = activeId ? active.selectionStart : 0;
    const selEnd = activeId ? active.selectionEnd : 0;
    while (list.firstChild) list.removeChild(list.firstChild);
    notes.slice().sort(byNumber).forEach((n) => list.appendChild(itemFor(n)));
    notesEmpty.hidden = notes.length > 0;
    const loading = mode === 'loading' || (mode === 'shared' && !heardNotes);
    notesEmpty.textContent = loading ? 'Loading the notes…' : editable() ? 'No notes yet. Select a box, a port, or a line, then Add note.' : 'No notes.';
    notesCount.textContent = notes.length ? String(notes.length) : '';
    showPanel.textContent = notes.length ? 'Panel · ' + notes.length : 'Panel';
    renderPins();
    const again = activeId ? list.querySelector('[data-note="' + activeId + '"] textarea') : null;
    if (again) {

      try { again.setSelectionRange(selStart, selEnd); } catch (error) { /* not a text field */ }
    }
  }
  function dateOf(iso) {
    return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function itemFor(n) {
    const write = editable();
    const li = document.createElement('li');
    li.className = 'note' + (n.resolved ? ' is-resolved' : '');
    li.setAttribute('data-note', n.id);

    const badge = document.createElement('button');
    badge.type = 'button';
    badge.className = 'badge';

    const on = document.createElement('span');

    on.appendChild(document.createTextNode('on '));
    const b = document.createElement('b');
    b.textContent = label;
    on.appendChild(b);
    head.appendChild(badge);
    head.appendChild(on);
    if (write) {

    textarea.className = 'text';
    textarea.rows = 2;
    textarea.value = n.text;
    textarea.readOnly = !write || n.by === 'claude';
    textarea.placeholder = write ? 'Write the note' : '';
    textarea.setAttribute('aria-label', 'Note ' + n.no + ', on ' + label);
    textarea.addEventListener('input', () => {
      n.text = textarea.value;

      textarea.style.height = textarea.scrollHeight + 2 + 'px';
      noteChanged(n, ['text', 'updated']);
    });
    textarea.addEventListener('focus', () => markNote(n, true));
    textarea.addEventListener('blur', () => markNote(n, false));
    li.appendChild(head);
    li.appendChild(textarea);
    if (n.response) {
      const response = document.createElement('p');
      response.className = 'response';
      const who = document.createElement('b');
      who.textContent = 'Claude: ';
      response.appendChild(who);
      response.appendChild(document.createTextNode(n.response));
      li.appendChild(response);
    }
    const meta = document.createElement('p');
    meta.className = 'meta';
    meta.textContent = (n.by === 'claude' ? 'From Claude · ' : '') + 'Added ' + dateOf(n.created) + (n.resolved ? ' · resolved' : '');
    li.appendChild(meta);
    badge.addEventListener('click', () => {
      // The target, in the view that draws it (for a line that isn't drawn, the part or port it starts from).
      const rel = relById(n.target);
      const vid = viewShowing(n.target) || (rel ? viewShowing(rel.from) : null);
      const L = vid ? viewLayout(vid) : null;
      const r = L ? L.rects.get(n.target) : null;
      let at = r ? center(r) : null;
      if (!at && rel && L) { const e = rel.hidden ? null : endpoints(rel, L); at = e ? e.mid : (L.rects.get(rel.from) ? center(L.rects.get(rel.from)) : null); }
      if (at) showPoint(at.x, at.y);
      if (layout.ids.has(n.target)) select({ type: 'el', id: n.target }, vid);
      else if (rel) select({ type: 'rel', id: n.target }, vid);
      say('Showing note ' + n.no + ', on ' + label + '.');
    });
    li.addEventListener('mouseenter', () => markNote(n, true));
    li.addEventListener('mouseleave', () => markNote(n, li.contains(document.activeElement)));
    requestAnimationFrame(() => { textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 2 + 'px'; });
    return li;
  }
  function markNote(n, on) {
    const li = list.querySelector('[data-note="' + n.id + '"]');
    if (li) li.classList.toggle('is-active', on);
    svg.querySelectorAll('.pin[data-note="' + n.id + '"]').forEach((pin) => pin.classList.toggle('is-active', on));
    svg.querySelectorAll('[data-el="' + n.target + '"], [data-rel="' + n.target + '"]').forEach((g) => g.classList.toggle('is-hover', on));
  }
  function focusNote(id) {
    setPanel(true);
    const textarea = list.querySelector('[data-note="' + id + '"] textarea');
    if (!textarea) return;
    textarea.focus({ preventScroll: true });
    textarea.closest('li').scrollIntoView({ block: 'nearest' });
  }
  function addNote() {
    const s = resolve(selection);
    if (!s || s.type === 'view' || !editable()) return;
    // A note's about needs a name, so an element of a kind without one (a start node) can't carry a note.
    if (s.type === 'el' && !M.hasName(s.item.kind)) {
      say('A ' + M.KINDS[s.item.kind].label + ' can\'t carry a note. Note the ' + (s.item.owner !== undefined ? 'element it belongs to' : 'package') + ' instead.');
      return;
    }
    const stamp = now();
    const n = {
      id: newId('n'), no: nextNumber(), target: s.item.id, targetLabel: M.labelFor(model, s.item.id), text: '', by: 'user',
      created: stamp, updated: stamp, response: '', resolved: false
    };
    notes.push(n);
    renderNotes();
    noteChanged(n, null);
    focusNote(n.id);
    say('Added note ' + n.no + ' on ' + n.targetLabel + '.');
  }
  addNoteButton.addEventListener('click', addNote);
  function removeNote(id, quiet) {
    const n = noteById(id);
    if (!n) return;
    notes.splice(notes.indexOf(n), 1);
    clearTimeout(noteTimers[id]);
    if (mode === 'local') saveLocal();
    else if (mode === 'shared') deleteShared(id);
    if (!quiet) renderPins();
  }
  // A note changed here: fields says which of its fields, or null for a new note.
  function noteChanged(n, fieldsChanged) {
    if (mode === 'local') { saveLocal(); return; }
    if (mode !== 'shared') return;
    if (!fieldsChanged) { stageNote(n.id); writeShared(n, null); return; }
    stageNote(n.id);
    clearTimeout(noteTimers[n.id]);
    noteTimers[n.id] = setTimeout(() => writeShared(n, fieldsChanged), PAUSE);
  }

  // ---- Where the model and the notes are kept. Published on claude.ai: the page's store, which Claude reads too.
  // Opened as a file: this browser, starting from what is saved in the file.

  function start() {
    Object.keys(M.VIEW_KINDS).forEach((k) => {
      const o = document.createElement('option');
      o.value = k;
      o.textContent = M.VIEW_KINDS[k].name;
      newViewKind.appendChild(o);
    });
    const claude = window.claude;
    if (!claude || typeof claude.use !== 'function') { startLocal(); return; }
    chrome();
    render();
    renderNotes();
    claude.use('db').then((found) => {
      if (!found) {
        setMode('read', 'This view can\'t reach the shared store, so this is the model as it was saved in the page.');
        return null;
      }
      db = found;
      return claude.use('user').then((user) => (user ? user.can('data.write') : null)).then((allowed) => startShared(allowed !== false));
    }).catch(() => {
      if (mode === 'loading') setMode('read', 'The shared store couldn\'t be reached. Reload the page to try again.');
    });
  }
  function setMode(next, why) {
    mode = next;
    reason = why || '';
    chrome();
    renderInspector();
    renderNotes();
  }
  function chrome() {
    const write = editable();
    where.textContent = reason || WHERE[mode];
    downloadButton.hidden = mode !== 'local';
    importButton.hidden = !write;
    newViewButton.hidden = !write;
    newViewKind.hidden = !write;
    paletteKind = null;
    setActive(active);
    updateUndo();
    hint.textContent = baseHint();
  }

  // -- This browser.
  function storageKey() { return STATE_KEY + (saved.model.revision || 'unsaved'); }
  function saveLocal() {
    try {
      localStorage.setItem(storageKey(), JSON.stringify({ model: model, notes: notes, changes: changes }));
      warning.hidden = true;
    } catch (error) {
      warning.hidden = false;
    }
  }
  function startLocal() {
    mode = 'local';
    try {
      const data = JSON.parse(localStorage.getItem(storageKey()) || 'null');
      if (data && data.model) {
        model = M.normalize(data.model);
        active = model.views[0].id;
        notes = (Array.isArray(data.notes) ? data.notes : []).filter(isNote).map(tidyNote);
        changes = Array.isArray(data.changes) ? data.changes.slice(-200) : [];
      }
    } catch (error) { /* start from the file */ }
    chrome();
    render();
    renderNotes();
  }

  // -- The page's store: one document with the working model, and a collection with one document per note.
  let lastWritten = null;        // the model as last written or read, to tell our own writes coming back
  let modelQueue = Promise.resolve();
  const noteQueue = {};
  const dirty = new Map();       // note id -> a counter while a change made here hasn't been written
  let heardModel = false;

  function startShared(writable) {
    mode = writable ? 'shared' : 'read';
    reason = '';
    const slow = setTimeout(() => { if (!heardModel || !heardNotes) say('The shared store can\'t be reached yet, so this may be out of date.'); }, 10000);
    const heard = () => { if (heardModel && heardNotes) { clearTimeout(slow); if (status.textContent.indexOf('shared store') >= 0) say(''); } };
    db.doc(WORKING).onSnapshot((snap) => {
      const first = !heardModel;
      if (!snap.metadata.fromCache && !heardModel) { heardModel = true; heard(); }
      const data = snap.exists ? snap.data() : null;
      if (!data || data.baseRevision !== saved.model.revision || !data.model) return;
      const json = JSON.stringify(data.model);
      if (json === lastWritten) return;
      if (drag || saveTimer) return;
      lastWritten = json;
      model = M.normalize(data.model);
      if (Array.isArray(data.changes)) changes = data.changes.slice(-200);
      // A model from elsewhere is a new starting point: what was done here before it can't be taken back.
      history = [];
      modelReplaced();
      if (!first && !snap.metadata.hasPendingWrites) say('The model was updated elsewhere, so the undo history starts afresh.');
    }, () => setMode('read', 'The shared store stopped answering. Reload the page to see the latest.'));
    db.collection(NOTES).onSnapshot((snap) => {
      const first = !heardNotes;
      if (!snap.metadata.fromCache && !heardNotes) { heardNotes = true; heard(); }
      const remote = new Map();
      snap.docs.forEach((doc) => {
        const body = doc.data();
        if (!body) return;
        const n = Object.assign({}, body, { id: doc.id });
        if (isNote(n)) remote.set(doc.id, tidyNote(n));
      });
      // A page published somewhere new has an empty store: the notes saved in the file go into it, once.
      if (first && heardNotes && remote.size === 0 && writable && saved.notes.length) {
        saved.notes.forEach((n) => { const copy = tidyNote(n); stageNote(copy.id); writeShared(copy, null); remote.set(copy.id, copy); });
        say('Loaded ' + plural(saved.notes.length, 'note') + ' saved with the page into the shared store.');
      }
      const next = [];
      notes.forEach((n) => { if (dirty.has(n.id)) { next.push(n); remote.delete(n.id); } });
      remote.forEach((n) => next.push(n));
      notes = next;
      renderNotes();
    }, () => setMode('read', 'The notes stopped updating. Reload the page to see the latest.'));
    chrome();
    render();
    renderInspector();
    renderNotes();
  }
  function persist() {
    saveTimer = null;
    if (mode === 'local') { saveLocal(); return; }
    if (mode !== 'shared') return;
    const body = { baseRevision: saved.model.revision, model: JSON.parse(JSON.stringify(model)), changes: changes.slice(-200), updated: now() };
    lastWritten = JSON.stringify(body.model);
    modelQueue = modelQueue.then(() => attempt(() => db.doc(WORKING).set(body))).catch((error) => refused(error, 'The change to the model wasn\'t saved.'));
  }
  // What the store keeps of a note; a free note (target null) carries its place, x and y, too.
  function noteBody(n) {
    const body = { no: n.no, target: n.target, targetLabel: n.targetLabel, text: n.text, by: n.by, created: n.created, updated: n.updated, response: n.response, resolved: n.resolved };
    if (n.target === null) { body.x = n.x; body.y = n.y; }
    return body;
  }
  function stageNote(id) { dirty.set(id, (dirty.get(id) || 0) + 1); }
  function enqueue(id, job) {
    const next = (noteQueue[id] || Promise.resolve()).then(job, job);
    noteQueue[id] = next;
    const done = () => { if (noteQueue[id] === next) delete noteQueue[id]; };
    next.then(done, done);
  }
  function writeShared(n, fieldsChanged) {
    if (!db) return;
    const seq = dirty.get(n.id);
    const body = noteBody(n);
    const ref = db.collection(NOTES).doc(n.id);
    const picked = {};
    (fieldsChanged || []).forEach((k) => { picked[k] = body[k]; });
    enqueue(n.id, () => attempt(() => (fieldsChanged ? ref.update(picked) : ref.set(body)))
      .catch((error) => {
        if (fieldsChanged && error && error.code === 'invalid_argument') return attempt(() => ref.set(body));
        throw error;
      })
      .then(() => { if (dirty.get(n.id) === seq) dirty.delete(n.id); },
        (error) => { dirty.delete(n.id); refused(error, 'A change to the notes wasn\'t saved.'); }));
  }
  function deleteShared(id) {
    if (!db) return;
    dirty.delete(id);
    enqueue(id, () => attempt(() => db.collection(NOTES).doc(id).delete()).catch((error) => refused(error, 'The note wasn\'t deleted in the shared store.')));
  }
  function attempt(fn) {
    return Promise.resolve().then(fn).catch((error) => {
      if (!error || error.code !== 'unavailable') throw error;
      return new Promise((resolve) => setTimeout(resolve, 400 + Math.random() * 800)).then(fn);
    });
  }
  function refused(error, fallback) {
    const code = error && error.code;
    if (code === 'invalid_argument' || code === 'revoked' || code === 'not_granted') setMode('read', 'You can look at this model here but not change it.');
    else if (code === 'quota_exceeded') say('The shared store is full. Delete some notes, then try again.');
    else say(fallback + ' Check your connection, then try again.');
  }

  // ---- Taking the state out and bringing it in.

  function stateFile() {
    return { format: M.FORMAT, revision: saved.model.revision, saved: now(), model: model, notes: notes, changes: changes };
  }
  downloadButton.addEventListener('click', () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(stateFile(), null, 2) + '\n'], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = 'canvas-state.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    say('Downloading the model and ' + plural(notes.length, 'note') + ' as canvas-state.json.');
  });
  // On the published page an import replaces the shared model and every note, so it asks for a second click.
  let importArmed = -Infinity;
  importButton.addEventListener('click', () => {
    if (mode === 'shared' && performance.now() - importArmed > 5000) {
      importArmed = performance.now();
      say('Importing replaces the shared model and deletes every note, Claude\'s answers included. Click Import state again to go on.');
      return;
    }
    importArmed = -Infinity;
    fileInput.click();
  });
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file || !editable()) return;
    file.text().then((raw) => {
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object' || !data.model) throw new Error('no model');
      const before = snapshot();
      model = M.normalize(data.model);
      const incoming = (Array.isArray(data.notes) ? data.notes : []).filter(isNote).map(tidyNote);
      notes.slice().forEach((n) => removeNote(n.id, true));
      notes = incoming;
      changes = Array.isArray(data.changes) ? data.changes.slice(-200) : [];
      commit('Imported the state from ' + file.name, null, before);
      logChange('Imported the state from ' + file.name);
      selection = null;
      modelReplaced();
      if (mode === 'shared') notes.forEach((n) => { stageNote(n.id); writeShared(n, null); });
      changed();
      say('Imported ' + plural(model.elements.length, 'element') + ', ' + plural(model.views.length, 'view') + ', and ' + plural(notes.length, 'note') + ' from ' + file.name + '.');
    }).catch(() => say(file.name + ' isn\'t a state file from this page.'));
  });

  // ---- The export: the model as textual SysML v2.

  function openExport() {
    while (exportProblems.firstChild) exportProblems.removeChild(exportProblems.firstChild);
    problems.forEach((p) => {
      const li = document.createElement('li');
      li.textContent = p.message;
      exportProblems.appendChild(li);
    });
    exportText.value = M.toSysML(model, notes);
    exportPanel.hidden = false;
    say(problems.length ? plural(problems.length, 'problem') + ' to fix before this is correct SysML.' : '');
  }
  function closeExport() { exportPanel.hidden = true; document.querySelector('.stage').classList.remove('has-export'); }
  $('export').addEventListener('click', () => {
    if (!exportPanel.hidden) { closeExport(); return; }
    openExport();
    document.querySelector('.stage').classList.add('has-export');
  });
  $('close-export').addEventListener('click', closeExport);
  $('copy-export').addEventListener('click', () => {
    const text = exportText.value;
    const byHand = () => { exportText.focus(); exportText.select(); say('This browser wouldn\'t copy for the page. The text is selected: copy it from there.'); };
    try { navigator.clipboard.writeText(text).then(() => say('Copied the model as textual SysML v2.'), byHand); } catch (error) { byHand(); }
  });

  // ---- Moving around and pointing at things.

  const pointers = {};
  let gesture = null;
  function pointerCount() { return Object.keys(pointers).length; }
  function twoPointers() {
    const ids = Object.keys(pointers);
    const a = pointers[ids[0]];
    const b = pointers[ids[1]];
    return { mid: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, dist: Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1) };
  }
  // What is under the pointer: a pin, a problem's badge, a renderer's own control (anything with data-action, run
  // through ACTIONS; never dragged), an element, a line, a frame's tab, or the plane; with the view it belongs to,
  // from the frame it is drawn in.
  function hitOf(target) {
    const closest = (sel) => (target.closest ? target.closest(sel) : null);
    const frame = closest('.frame');
    const view = frame ? frame.getAttribute('data-view') : null;
    const pin = closest('.pin');
    if (pin) return { type: 'pin', id: pin.getAttribute('data-note'), view: pin.getAttribute('data-view') };
    const badge = closest('.problem');
    if (badge) return { type: 'problem', id: badge.getAttribute('data-for'), view: badge.getAttribute('data-view') };
    const action = closest('[data-action]');
    if (action) return { type: 'action', action: action.getAttribute('data-action'), id: action.getAttribute('data-for'), g: action, view: view, hint: action.getAttribute('data-hint') };
    const elG = closest('[data-el]');
    if (elG) return { type: 'el', id: elG.getAttribute('data-el'), g: elG, view: view };
    const relG = closest('[data-rel]');
    if (relG) return { type: 'rel', id: relG.getAttribute('data-rel'), g: relG, view: view };
    if (closest('.tab')) return { type: 'tab', id: view, view: view };
    return { type: 'plane', view: null };
  }

  svg.addEventListener('pointerdown', (event) => {
    if (event.pointerType === 'mouse' && event.button > 1) return;
    event.preventDefault();
    canvas.focus({ preventScroll: true });
    pointers[event.pointerId] = { x: event.clientX, y: event.clientY, button: event.button };
    try { svg.setPointerCapture(event.pointerId); } catch (error) { /* not capturable */ }
    canvas.classList.add('is-pointer');
    if (pointerCount() === 2) {
      const t = twoPointers();
      gesture = { pinch: { mid: t.mid, dist: t.dist, cx: camera.x, cy: camera.y, k: camera.k }, moved: true };
      if (drag && drag.moved) finishDrag(event); // the move so far stays, and is saved
      drag = null;
      return;
    }
    if (pointerCount() > 2) return;
    const hit = hitOf(event.target);
    const el = hit.type === 'el' ? layout.ids.get(hit.id) : null;
    const view = hit.view ? viewById(hit.view) : null;
    const movable = editable() && !tool && event.button !== 1 && view && (el || hit.type === 'tab');
    const p = toDrawing(event.clientX, event.clientY);
    drag = null;
    if (movable) {
      drag = hit.type === 'tab'
        ? { kind: 'view', id: view.id, view: view.id, start: p, from: { x: view.x, y: view.y }, moved: false }
        : rendererFor(view).dragStart(view, el, p);
    }
    gesture = { x: event.clientX, y: event.clientY, cx: camera.x, cy: camera.y, moved: false, hit: hit, pan: !drag };
  });
  svg.addEventListener('pointermove', (event) => {
    const p = pointers[event.pointerId];
    if (!p) { hover(event); return; }
    p.x = event.clientX;
    p.y = event.clientY;
    if (!gesture) return;
    if (gesture.pinch) {
      if (pointerCount() < 2) return;
      const s = stageSize();
      const t = twoPointers();
      const g = gesture.pinch;
      const k = clamp(g.k * t.dist / g.dist, MIN_ZOOM, MAX_ZOOM);
      const wx = g.cx + (g.mid.x - s.left) / g.k;
      const wy = g.cy + (g.mid.y - s.top) / g.k;
      camera = { k: k, x: wx - (t.mid.x - s.left) / k, y: wy - (t.mid.y - s.top) / k };
      applyCamera();
      return;
    }
    const dx = p.x - gesture.x;
    const dy = p.y - gesture.y;
    if (!gesture.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    if (!gesture.moved) {
      gesture.moved = true;
      if (gesture.pan) canvas.classList.add('is-panning');
      setHover(null);
    }
    if (gesture.pan) {
      camera = { k: camera.k, x: gesture.cx - dx / camera.k, y: gesture.cy - dy / camera.k };
      applyCamera();
    } else if (drag) {
      moveDrag(event);
    }
  });
  // A drag moves a view by its tab, or an element in its view through the view's renderer. Its first move takes the
  // model as it was, so the whole drag is one undo step.
  function moveDrag(event) {
    const p = toDrawing(event.clientX, event.clientY);
    if (!drag.moved) { drag.moved = true; drag.before = snapshot(); }
    if (drag.kind === 'view') {
      const view = viewById(drag.id);
      if (!view) return;
      view.x = Math.round(drag.from.x + (p.x - drag.start.x));
      view.y = Math.round(drag.from.y + (p.y - drag.start.y));
      render();
      return;
    }
    const view = viewById(drag.view);
    const el = layout.ids.get(drag.id);
    if (!view || !el || !view.layout[el.id]) return;
    rendererFor(view).drag(view, el, drag, p);
    render();
    if (drag.over) {
      const g = svg.querySelector('.frame[data-view="' + view.id + '"] [data-el="' + drag.over + '"]');
      if (g) g.classList.add('is-drop');
    }
  }
  function finishDrag(event) {
    if (drag.kind === 'view') {
      const view = viewById(drag.id);
      if (!view) return;
      commit('Moved the ' + M.describeView(model, view), null, drag.before);
      logChange('Moved the ' + M.describeView(model, view), 'move:' + view.id);
      render();
      changed();
      say('Moved the ' + M.describeView(model, view) + '.');
      return;
    }
    const view = viewById(drag.view);
    const el = layout.ids.get(drag.id);
    if (!view || !el || !view.layout[el.id]) return;
    const result = rendererFor(view).drop(view, el, drag, toDrawing(event.clientX, event.clientY), event);
    if (result && result.undo) {
      commit(result.undo, null, drag.before);
      logChange(result.text, result.key);
    }
    render();
    renderInspector();
    changed();
    if (result) say(result.say || result.text + '.');
  }
  function endPointer(event) {
    const p = pointers[event.pointerId];
    if (!p) return;
    delete pointers[event.pointerId];
    const left = pointerCount();
    if (left === 1) {
      const q = pointers[Object.keys(pointers)[0]];
      gesture = { x: q.x, y: q.y, cx: camera.x, cy: camera.y, moved: true, hit: { type: 'plane' }, pan: true };
      drag = null;
      return;
    }
    if (left > 0) return;
    const g = gesture;
    gesture = null;
    canvas.classList.remove('is-panning');
    if (!g || g.pinch) { drag = null; return; }
    if (g.moved) {
      if (drag && drag.moved) finishDrag(event);
      drag = null;
      return;
    }
    drag = null;
    if (event.type !== 'pointerup' || p.button !== 0) return;
    click(g.hit, event);
  }
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);
  // A click: on a renderer's control, its action runs; with a tool, it places or draws (or does what a tool of TOOLS
  // does); without one, it selects what is under it. The empty plane inside a frame selects the view; outside every
  // frame it clears the selection and leaves the active view as it is.
  function click(hit, event) {
    if (hit.type === 'pin') { focusNote(hit.id); return; }
    const p = toDrawing(event.clientX, event.clientY);
    if (hit.type === 'problem') {
      const sel = selectionFor(hit.id);
      if (sel) select(sel, hit.view);
      say(problems.filter((q) => marksFor(q).indexOf(hit.id) >= 0).map((q) => q.message).join(' '));
      return;
    }
    if (hit.type === 'action') { if (ACTIONS[hit.action]) ACTIONS[hit.action](hit, p, event); return; }
    if (tool && !editable()) { setTool(null); return; }
    if (tool && TOOLS[tool]) { TOOLS[tool](hit, p, event); return; }
    if (tool && M.KINDS[tool]) { place(tool, hit, p); return; }
    if (tool) { connectStep(tool, hit); return; }
    if (hit.type === 'el' || hit.type === 'rel') { select({ type: hit.type, id: hit.id }, hit.view); return; }
    if (hit.type === 'tab') { select({ type: 'view', id: hit.id }); return; }
    const vid = viewAt(p);
    if (vid) { select({ type: 'view', id: vid }); return; }
    select(null);
  }

  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();
    const scale = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? stageSize().height : 1;
    let dx = event.deltaX * scale;
    let dy = event.deltaY * scale;
    if (event.ctrlKey || event.metaKey) {
      zoomAt(Math.exp(-dy * 0.01), event.clientX, event.clientY);
    } else {
      if (event.shiftKey && !dx) { dx = dy; dy = 0; }
      camera = { k: camera.k, x: camera.x + dx / camera.k, y: camera.y + dy / camera.k };
      applyCamera();
    }
  }, { passive: false });

  canvas.addEventListener('keydown', (event) => {
    canvas.classList.remove('is-pointer');
    const step = 80 / camera.k;
    let handled = true;
    if ((event.ctrlKey || event.metaKey) && (event.key === 'z' || event.key === 'Z')) { undo(); event.preventDefault(); return; }
    switch (event.key) {
      case 'ArrowLeft': camera.x -= step; applyCamera(); break;
      case 'ArrowRight': camera.x += step; applyCamera(); break;
      case 'ArrowUp': camera.y -= step; applyCamera(); break;
      case 'ArrowDown': camera.y += step; applyCamera(); break;
      case '+': case '=': zoomAtCenter(1.25); break;
      case '-': case '_': zoomAtCenter(0.8); break;
      case '0': fit(); break;
      case 'Escape': if (tool) setTool(null); else select(null); break;
      case 'Delete': deleteSelection(); break;
      default: handled = false;
    }
    if (handled) event.preventDefault();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && tool && !(event.target.closest && event.target.closest('input, textarea, select'))) setTool(null);
  });
  $('zoom-in').addEventListener('click', () => zoomAtCenter(1.25));
  $('zoom-out').addEventListener('click', () => zoomAtCenter(0.8));
  $('zoom-fit').addEventListener('click', fit);

  function setHover(g) {
    if (hovered === g) return;
    if (hovered) hovered.classList.remove('is-hover');
    hovered = g;
    if (g) g.classList.add('is-hover');
  }
  function hover(event) {
    const hit = hitOf(event.target);
    if (hit.type === 'pin') { setHover(null); hint.textContent = 'Click the pin to read its note.'; return; }
    if (hit.type === 'problem') { setHover(null); hint.textContent = 'Click the badge to select what has the problem; the panel says what it is.'; return; }
    if (hit.type === 'action') { setHover(null); hint.textContent = hit.hint || baseHint(); return; }
    if (hit.type === 'tab') {
      setHover(null);
      const view = viewById(hit.id);
      hint.textContent = (view ? M.describeView(model, view) : 'view') + (editable() ? ' · click to select, drag to move the view' : ' · click to select');
      return;
    }
    if (hit.type === 'plane') { setHover(null); hint.textContent = baseHint(); return; }
    setHover(hit.g);
    const what = M.labelFor(model, hit.id);
    if (tool) hint.textContent = what + ' · ' + baseHint();
    else if (hit.type === 'el') hint.textContent = what + (editable() ? ' · click to select, drag to move' : ' · click to select');
    else hint.textContent = what + ' · click to select';
  }
  svg.addEventListener('pointerleave', () => { setHover(null); hint.textContent = baseHint(); });

  if (window.ResizeObserver) new ResizeObserver(() => { if (camera && layout) applyCamera(); }).observe(canvas);
  else window.addEventListener('resize', () => { if (camera && layout) applyCamera(); });

  // A change still waiting for its pause is saved when the page is left or put away.
  const flush = () => { if (saveTimer) { clearTimeout(saveTimer); persist(); } Object.keys(noteTimers).forEach((id) => { clearTimeout(noteTimers[id]); const n = noteById(id); if (n) writeShared(n, ['text', 'updated']); delete noteTimers[id]; }); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

  start();
  if (NARROW.matches) setPanel(false);
})();
</script>
</body>
</html>
